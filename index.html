<script>
/* Permit Desk storage layer: runs the app without Claude.
   MODE "local"  -> everything is saved in this browser (localStorage).
   MODE "remote" -> everything is saved online through /api/data (password protected). */
(function(){
  const MODE = window.PD_MODE || 'local';
  const LS_KEY = 'permitdesk-data-v1';
  const docs = new Map();            // path -> data
  const docL = new Map();            // path -> Set(listener)
  const colL = new Map();            // collection -> Set(listener)
  let version = 0, ready = null;

  const clone = v => v==null ? v : JSON.parse(JSON.stringify(v));
  const isTop = (path, coll) => { const p = path.split('/'); return p.length===2 && p[0]===coll; };
  function snapDoc(path){ const d = docs.get(path); return { id: path.split('/').pop(), exists: d!==undefined, data: ()=>clone(d), metadata:{fromCache:false} }; }
  function snapCol(coll){ const out=[]; docs.forEach((d,p)=>{ if(isTop(p,coll)) out.push({id:p.split('/')[1], data:()=>clone(d)}); }); return {docs:out, size:out.length, empty:!out.length, metadata:{fromCache:false}}; }
  function emit(paths){
    const colls = new Set();
    paths.forEach(p=>{ (docL.get(p)||[]).forEach(cb=>{ try{cb(snapDoc(p));}catch(e){console.error(e);} }); const s=p.split('/'); if(s.length===2) colls.add(s[0]); });
    colls.forEach(c=>(colL.get(c)||[]).forEach(cb=>{ try{cb(snapCol(c));}catch(e){console.error(e);} }));
  }
  function emitAll(){ emit([...new Set([...docs.keys(), ...docL.keys()])]); colL.forEach((s,c)=>s.forEach(cb=>cb(snapCol(c)))); }
  function applyOps(ops){
    ops.forEach(o=>{
      if(o.op==='delete') docs.delete(o.path);
      else if(o.op==='update'){ if(!docs.has(o.path)) throw Object.assign(new Error('Not found'),{code:'not-found'}); docs.set(o.path, {...docs.get(o.path), ...clone(o.data)}); }
      else docs.set(o.path, clone(o.data));
    });
  }
  function seedDocs(){ const el=document.getElementById('pd-seed'); return el ? JSON.parse(el.textContent) : {}; }

  /* ---------- local backend ---------- */
  function localSave(){
    const obj={}; docs.forEach((d,p)=>obj[p]=d);
    try{ localStorage.setItem(LS_KEY, JSON.stringify({version, docs:obj})); }
    catch(e){ alert('This browser could not save your changes (storage full or blocked). Use Backup to download a copy.'); throw e; }
  }
  async function localLoad(){
    let raw=null; try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
    const st = raw ? JSON.parse(raw) : {version:1, docs:seedDocs()};
    version = st.version||1; Object.entries(st.docs).forEach(([p,d])=>docs.set(p,d));
    if(!raw) localSave();
    window.addEventListener('storage', e=>{ if(e.key===LS_KEY && e.newValue){ const st=JSON.parse(e.newValue); docs.clear(); Object.entries(st.docs).forEach(([p,d])=>docs.set(p,d)); version=st.version; emitAll(); } });
  }

  /* ---------- remote backend ---------- */
  const auth = () => { try{ return JSON.parse(localStorage.getItem('permitdesk-login')||'null'); }catch(e){ return null; } };
  async function api(method, body){
    if(MODE==='github') return ghApi(method, body);
    if(MODE==='supabase') return sbApi(method, body);
    const a = auth();
    const r = await fetch('/api/data'+(method==='GET'?'?v='+version:''), {method, cache:'no-store', headers:{'content-type':'application/json','x-pd-pass':a?.pass||''}, body: body?JSON.stringify(body):undefined});
    if(r.status===401){ localStorage.removeItem('permitdesk-login'); location.reload(); throw new Error('Wrong password'); }
    if(!r.ok) throw new Error((await r.text())||('Server error '+r.status));
    return r.json();
  }

  /* ---------- GitHub backend: data.json in a private repo; every save is a commit ---------- */
  const GH = Object.assign({owner:'johnsochet19', repo:'permit-desk-data', path:'data.json', branch:'main', api:'https://api.github.com'}, window.PD_GH||{});
  const ghBase = () => `${GH.api}/repos/${GH.owner}/${GH.repo}`;
  async function gh(url, opts={}, token){
    const r = await fetch(url.startsWith('http')?url:ghBase()+url, {...opts, cache:'no-store', headers:{'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Authorization':'Bearer '+(token||auth()?.pass||''), ...(opts.headers||{})}});
    if(r.status===401 && !token){ localStorage.removeItem('permitdesk-login'); alert('Your GitHub access key stopped working (expired or revoked). Sign in again with a new one.'); location.reload(); throw new Error('Bad key'); }
    return r;
  }
  const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')), c=>c.charCodeAt(0)));
  function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
  function serialize(obj){ const keys=Object.keys(obj).sort(); return '{"app":"Permit Desk","docs":{\n'+keys.map(k=>JSON.stringify(k)+':'+JSON.stringify(obj[k])).join(',\n')+'\n}}\n'; }
  async function ghRead(){
    const r = await gh(`/contents/${GH.path}?ref=${GH.branch}`);
    if(r.status===404) return {sha:null, docs:{}};
    if(!r.ok) throw new Error('GitHub said '+r.status+' reading the data');
    const m = await r.json(); let b64 = m.content;
    if(!b64 || !b64.trim()){ const r2 = await gh(`/git/blobs/${m.sha}`); if(!r2.ok) throw new Error('GitHub said '+r2.status+' reading the data'); b64=(await r2.json()).content; }
    return {sha:m.sha, docs:JSON.parse(b64dec(b64)).docs||{}};
  }
  function describe(ops, docs){
    const o=ops[0]; if(!o) return 'Update'; const d={...(docs&&docs[o.path]||{}), ...(o.data||{})};
    const proj = d.projectId && docs ? docs['projects/'+d.projectId]?.name : ''; const what = (d.code&&d.name ? `${d.code} ${d.name}` : (d.name || o.path)) + (proj?` (${proj})`:'');
    return (o.op==='delete'?'Delete ':'Update ')+what+(ops.length>1?` (+${ops.length-1} more)`:'');
  }
  async function ghApi(method, body){
    if(method==='GET'){ const st=await ghRead(); return {version:st.sha||0, docs:st.docs}; }
    for(let attempt=0; attempt<5; attempt++){
      const st = await ghRead(); const d = st.docs;
      if(body.replace) Object.keys(d).forEach(k=>delete d[k]), Object.assign(d, body.replace);
      else for(const o of body.ops||[]){ if(o.op==='delete') delete d[o.path]; else if(o.op==='update') d[o.path]={...(d[o.path]||{}),...o.data}; else d[o.path]=o.data; }
      const msg = `${auth()?.name||'Someone'}: ${body.replace?'Restore from backup':describe(body.ops||[], d)}`;
      const r = await gh(`/contents/${GH.path}`, {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify({message:msg, content:b64enc(serialize(d)), branch:GH.branch, ...(st.sha?{sha:st.sha}:{})})});
      if(r.status===409 || r.status===422){ await new Promise(res=>setTimeout(res, 400*(attempt+1))); continue; }
      if(!r.ok) throw new Error('GitHub said '+r.status+' saving: '+((await r.json().catch(()=>({}))).message||''));
      return {version:(await r.json()).content.sha};
    }
    throw new Error('Someone else kept saving at the same moment; try again');
  }

  /* ---------- Supabase backend: email accounts, invites, live updates ---------- */
  const SB = Object.assign({url:'', key:''}, window.PD_SB||{});
  let sbReady=false, sb=null, sbUser=null, sbRole=null, sbMembers=[], sbInvites=[], sbChannel=null;
  const esc2 = v => String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function sbFn(name, body){
    const { data:{ session } } = await sb.auth.getSession();
    const r = await fetch(`${SB.url}/functions/v1/${name}`, {method:'POST', headers:{'content-type':'application/json', apikey:SB.key, ...(session?{authorization:'Bearer '+session.access_token}:{})}, body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({error:'Unexpected reply ('+r.status+')'}));
    if(!r.ok || j.error) throw new Error(j.error || ('Error '+r.status));
    return j;
  }
  async function sbAll(){
    const out={}; for(let from=0;;from+=1000){
      const { data, error } = await sb.from('docs').select('path,data').order('path').range(from, from+999);
      if(error) throw error; data.forEach(r=>out[r.path]=r.data); if(data.length<1000) break; }
    return out;
  }
  async function sbRefreshPeople(){
    const m = await sb.from('members').select('user_id,email,name,role,created_at').order('created_at');
    if(!m.error) sbMembers = m.data;
    const me = sbMembers.find(x=>x.user_id===sbUser?.id); sbRole = me?.role || null;
    if(sbRole==='admin'){ const i = await sb.from('invites').select('code,email,role,created_at,expires_at,used_at').is('used_at',null).order('created_at',{ascending:false}); if(!i.error) sbInvites = i.data.filter(x=>new Date(x.expires_at)>new Date()); }
  }
  async function sbApi(method, body){
    if(method==='GET') return {version:Date.now(), docs:await sbAll()};
    if(body.replace){ const { error } = await sb.rpc('docs_replace', {p_docs: body.replace}); if(error) throw new Error(error.message); return {version:Date.now()}; }
    for(const o of body.ops||[]){
      let r;
      if(o.op==='delete') r = await sb.from('docs').delete().eq('path', o.path);
      else if(o.op==='update') r = await sb.rpc('doc_merge', {p_path:o.path, p_patch:o.data});
      else r = await sb.from('docs').upsert({path:o.path, data:o.data});
      if(r.error) throw new Error(r.error.message);
    }
    return {version:Date.now()};
  }
  function sbSubscribe(){
    sbChannel = sb.channel('permit-desk')
      .on('postgres_changes', {event:'*', schema:'public', table:'docs'}, p=>{
        if(p.eventType==='DELETE'){ if(!p.old?.path) return; docs.delete(p.old.path); emit([p.old.path]); }
        else { docs.set(p.new.path, p.new.data); emit([p.new.path]); }
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'members'}, async ()=>{ await sbRefreshPeople(); window.render?.(); })
      .subscribe();
    // Safety net if the live connection drops: full refresh when the tab comes back.
    document.addEventListener('visibilitychange', async ()=>{ if(document.hidden) return; try{ replaceAll(await sbAll()); emitAll(); }catch(e){} });
  }
  function card(inner){ return `<div style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f3f4f2;font:15px -apple-system,Segoe UI,Arial,sans-serif;overflow:auto;padding:16px"><div class="pdcard" style="background:#fff;border:1px solid #d5d9d2;border-radius:8px;padding:24px;width:min(400px,92vw);display:flex;flex-direction:column;gap:12px">${inner}</div></div>`; }

  const btnS = 'font:inherit;padding:9px;border:0;border-radius:6px;background:#1f3b57;color:#fff;cursor:pointer';

        box.innerHTML = card(`<h2 style="margin:0;font-size:20px">Join Permit Desk</h2><p style="margin:0;color:#5d665f">You've been invited${inv.role==='admin'?' as an admin':''}. Create your account to get in.</p>${fld('Your name','n','text','autocomplete="name" required')}${fld('Email','e','email',`autocomplete="username" required ${inv.email?`value="${esc2(inv.email)}" readonly`:''}`)}${fld('Choose a password (8+ characters)','p','password','autocomplete="new-password" required minlength="8"')}<button data-x="join" style="${btnS}">Create account</button><small class="err" style="color:#b3362c"></small>`);
        box.querySelector('[data-x=join]').onclick = async()=>{ const n=box.querySelector('[name=n]').value.trim(), e=box.querySelector('[name=e]').value.trim(), p=box.querySelector('[name=p]').value; const err=box.querySelector('.err');
          if(!n){ err.textContent='Enter your name.'; return; } err.textContent='Creating your account…';
          try{ await sbFn('accept-invite', {code:join, email:e, password:p, name:n}); }catch(x){ err.textContent=x.message; return; }
          const { error } = await sb.auth.signInWithPassword({email:e, password:p}); if(error){ err.textContent=error.message; return; }
          // remember the name for emails/history and drop the code from the address bar
          history.replaceState(null,'',location.pathname+location.hash);
          await afterSignIn(); };
      }
      (async()=>{
        if(join) return showJoin();
        const { data:{ session } } = await sb.auth.getSession();
        if(session) return afterSignIn(); showLogin();
      })();

  async function sbStart(){
    if(!window.supabase?.createClient) throw new Error('Could not load the sign-in library. Check your connection and reload.');

    <section class="sec"><header><h3>Your password</h3></header><div class="bd fields"><label class="f">New password (8+ characters)<input type="password" id="pduMyPw" autocomplete="new-password"></label><div style="align-self:end"><button class="btn" data-pdu="mypw">Change my password</button></div></div></section>

  const say = (m)=> (window.toast ? window.toast(m) : console.log(m));

  document.addEventListener('click', async e=>{

  function replaceAll(obj){ docs.clear(); Object.entries(obj).forEach(([p,d])=>docs.set(p,d)); }
  async function remoteLoad(){
    if(MODE==='supabase') return sbStart();
    const res = await api('GET'); version=res.version; replaceAll(res.docs);
    setInterval(async()=>{ if(document.hidden) return; try{ const res=await api('GET'); if(res.docs && res.version!==version){ version=res.version; replaceAll(res.docs); emitAll(); } }catch(e){} }, MODE==='github'?20000:15000);
  }
  let queue = Promise.resolve();
  function write(ops){
    applyOps(ops); emit(ops.map(o=>o.path));
    if(MODE==='local'){ version++; localSave(); return Promise.resolve(); }
    const p = queue.then(()=>api('POST',{ops})).then(res=>{ version=res.version; });
    queue = p.catch(()=>{});
    return p.catch(e=>{ alert('Your last change was not saved online: '+e.message+'\nReloading to show what is saved.'); location.reload(); throw e; });
  }

  /* ---------- Firestore-like surface used by the app ---------- */
  const db = {
    doc(path){ return {
      onSnapshot(cb, err){ ready.then(()=>cb(snapDoc(path)), err); if(!docL.has(path)) docL.set(path,new Set()); docL.get(path).add(cb); return ()=>docL.get(path).delete(cb); },
      async get(){ await ready; return snapDoc(path); },
      async set(data){ await ready; return write([{op:'set',path,data}]); },
      async update(data){ await ready; return write([{op:'update',path,data}]); },
      async delete(){ await ready; return write([{op:'delete',path}]); }
    }; },
    collection(c){ return {
      onSnapshot(cb, err){ ready.then(()=>cb(snapCol(c)), err); if(!colL.has(c)) colL.set(c,new Set()); colL.get(c).add(cb); return ()=>colL.get(c).delete(cb); }

  window.PD_STORE = {

  function loginGate(){
    return new Promise(resolve=>{
      if(auth()) return resolve();
      const isGh = MODE==='github';
      const box=document.createElement('div');
      box.innerHTML=`<div style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f3f4f2;font:15px -apple-system,Segoe UI,Arial,sans-serif">
        <form style="background:#fff;border:1px solid #d5d9d2;border-radius:8px;padding:24px;width:min(400px,92vw);display:flex;flex-direction:column;gap:12px">
          <h2 style="margin:0;font-size:20px">Permit Desk</h2>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5d665f">Your name<input name="n" required autocomplete="name" style="font:inherit;padding:8px;border:1px solid #b8beb4;border-radius:6px"></label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5d665f">${isGh?'GitHub access key':'Password'}<input name="p" type="password" required autocomplete="off" style="font:inherit;padding:8px;border:1px solid #b8beb4;border-radius:6px"></label>
          ${isGh?`<small style="color:#5d665f;line-height:1.4">A fine-grained GitHub token with read and write access to <b>${GH.owner}/${GH.repo}</b> (Contents). It stays in this browser and is only sent to GitHub.</small>`:''}
          <button style="font:inherit;padding:9px;border:0;border-radius:6px;background:#1f3b57;color:#fff;cursor:pointer">Sign in</button>
          <small class="err" style="color:#b3362c"></small></form></div>`;
      document.body.appendChild(box);
      box.querySelector('form').onsubmit=async e=>{ e.preventDefault(); const f=e.target; const name=f.n.value.trim(), pass=f.p.value.trim(); const err=f.querySelector('.err'); err.textContent='Checking…';
        try{
          if(isGh){
            const r=await gh('', {}, pass);
            if(r.status===401){ err.textContent='GitHub did not accept that key.'; return; }
            if(r.status===404){ err.textContent=`GitHub didn't accept that key for ${GH.owner}/${GH.repo}. Check you copied the whole key and gave it access to that repository.`; return; }
            const j=await r.json(); if(j.permissions && !j.permissions.push){ err.textContent='That key can read but not save. Give it Contents: Read and write.'; return; }
          } else {
            const r=await fetch('/api/data?check=1',{headers:{'x-pd-pass':pass},cache:'no-store'});
            if(r.status===401){ err.textContent='That password is not right.'; return; }
          }
        }catch(x){ err.textContent='Could not reach '+(isGh?'GitHub':'the server')+'. Check your connection.'; return; }
        localStorage.setItem('permitdesk-login', JSON.stringify({name, pass, id:'u-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}));
        box.remove(); resolve(); };
    });

// ---------- computed ----------
function checksFor(r, all){
  const out=[];
  if(r.officialId && all.some(o=>o.id!==r.id && o.officialId && o.officialId.trim()===r.officialId.trim())) out.push('dupOfficial');
  if(r.code && all.some(o=>o.id!==r.id && o.projectId===r.projectId && o.code===r.code)) out.push('dupCode');
  if(r.currentStatus==='Issued' && !r.dIssue) out.push('issuedNoDate');
  if(r.currentStatus==='Issued' && !r.officialId) out.push('issuedNoId');
  if(r.dIssue && r.dExpiration && r.dIssue>r.dExpiration) out.push('issueAfterExp');
  if(r.dRenewalDue && r.dExpiration && r.dRenewalDue>r.dExpiration) out.push('renewAfterExp');
  if(r.recordStatus==='Archived' && !r.dActual && !(r.comments||'').trim()) out.push('archivedNoClose');
  if(!(r.name||'').trim()) out.push('noName');
  if(!r.currentStatus) out.push('noStatus');
  if(!r.bicCategory && !r.bicCompany && !r.bicPerson) out.push('noBic');
  if(r.bicPerson && r.bicCompany && S.contacts[r.bicPerson] && S.contacts[r.bicPerson].companyId!==r.bicCompany) out.push('bicMismatch');
  return out;
}
function deadlinesFor(r){
  const out=[]; if(r.recordStatus!=='Active' || CLOSED.includes(r.currentStatus)) return out;
  const t=daysUntil(r.dTarget); if(t!==null && !r.dActual){ if(t<0) out.push(['overdue',r.dTarget,t]); else if(t<=7) out.push(['due7',r.dTarget,t]); }
  if(r.setup?.expires!==false){ const e=daysUntil(r.dExpiration); if(e!==null && e>=0 && e<=60) out.push(['exp60',r.dExpiration,e]); }
  if(r.setup?.renewal!==false){ const n=daysUntil(r.dRenewalDue); if(n!==null && n>=0 && n<=30) out.push(['ren30',r.dRenewalDue,n]); }
  if(r.updatedAt && (Date.now()-Date.parse(r.updatedAt))/864e5>=30) out.push(['stale',r.updatedAt.slice(0,10),null]);
  return out;
}
let CMP=null;
function computed(){
  if(CMP) return CMP;
  const all=recs(); const map={};
  all.forEach(r=>{ map[r.id]={checks:checksFor(r,all),dl:deadlinesFor(r)}; });
  return CMP={all,map};
}
function progress(r){
  const st=stageOf(r.currentStatus);
  if(st==='done') return {done:7,cur:-1,label:'Complete'};
  const i=STAGES.indexOf(st);
  if(i<0) return {done:0,cur:-1,label:st==='Renewal'||st==='Expiry'?st:'Not yet started'};
  const done=i+(FINAL_IN_STAGE.includes(r.currentStatus)?1:0);
  return {done,cur:done<7?done:-1,label:r.currentStatus};
}
function trStatus(pid){
  const trs=recs().filter(r=>r.projectId===pid && r.agency==='TR (Special Inspections)' && r.recordStatus!=='Archived');
  if(!trs.length) return {n:0,label:'No TRs on this job',ok:null};
  const done=trs.filter(r=>r.trFinal || ['Signed Off','Closed'].includes(r.currentStatus)).length;
  return {n:trs.length,done,ok:done===trs.length,label:done===trs.length?`All ${trs.length} TRs signed off`:`${done} of ${trs.length} TRs have a Final`};
}
function myAlerts(){

}

function filtered(F=S.F){
  const {all,map}=computed();

    if(F.project.length && !F.project.includes(r.projectId)) return false;
    if(F.agency.length && !F.agency.includes(r.agency)) return false;
    if(F.category.length && !F.category.includes(r.category)) return false;
    if(F.status.length && !F.status.includes(r.currentStatus)) return false;
    if(F.priority.length && !F.priority.includes(r.priority)) return false;
    if(F.bic.length && !F.bic.includes(r.bicCategory)) return false;
    if(F.show.length && !F.show.includes(r.recordStatus||'Queued')) return false;
    if(F.check==='any' && !map[r.id].checks.length) return false;
    if(F.check && F.check!=='any' && !map[r.id].checks.includes(F.check)) return false;
    if(F.deadline && !map[r.id].dl.some(d=>d[0]===F.deadline)) return false;
    if(F.bicCompany && r.bicCompany!==F.bicCompany) return false;
    if(F.bicPerson && r.bicPerson!==F.bicPerson) return false;
    return true;
  });
}

const REPORTS=[['status','Status distribution','Records by current status, portfolio-wide or for one job.',[['status','Current status'],['statusProject','Status by project']]],['agency','Rollup by agency','Counts and open items per agency, across every project.',[['agency','Agency'],['project','Project']]],['bic','Ball-in-court load','Who is holding up the most items: the chase list.',[['category','Category'],['company','Company'],['person','Person']]],['aging','Aging / overdue','How long items have sat, and what is past its target date.',[['overdue','Overdue only'],['all','Every open item, oldest first']]],['upcoming','Upcoming deadlines','Everything due, expiring or renewing in a chosen window.',[]],['quality','Data quality','Open data-check flags, by project or by check.',[['project','Project'],['check','Check']]],['payment','Payment status','Outstanding fees across the portfolio.',[['outstanding','Outstanding items'],['status','By payment status']]]];
function reportData(){
  const P=S.rp; const R=REPORTS.find(r=>r[0]===S.report); const grp=P.group||(R[3][0]?.[0]);
  const {map}=computed();
  const base=recs().filter(r=>(!P.project||r.projectId===P.project)&&(!P.agency||r.agency===P.agency)&&(!P.status||r.currentStatus===P.status)&&(P.show==='All'||(P.show==='Archived'?r.recordStatus==='Archived':r.recordStatus==='Active')));
  const count=(fn)=>{const o={};base.forEach(r=>{const k=fn(r);if(k!=null&&k!=='')o[k]=(o[k]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
  const recRow=r=>[r.code,r.name,projName(r.projectId),r.agency,r.currentStatus];
  switch(S.report){
    case 'status': if(grp==='statusProject'){ const o={}; base.forEach(r=>{const k=projName(r.projectId)+' · '+r.currentStatus;o[k]=(o[k]||0)+1;}); return {h:['Project · status','Records'],rows:Object.entries(o).sort()}; } return {h:['Current status','Records'],rows:count(r=>r.currentStatus)};
    case 'agency': { const key=grp==='project'?(r=>projName(r.projectId)):(r=>r.agency); const o={}; base.forEach(r=>{const k=key(r);o[k]=o[k]||[0,0,0];o[k][0]++;if(map[r.id].dl.some(d=>d[0]==='overdue'))o[k][1]++;o[k][2]+=map[r.id].checks.length;}); return {h:[grp==='project'?'Project':'Agency','Records','Overdue','Open flags'],rows:Object.entries(o).sort((a,b)=>b[1][0]-a[1][0]).map(([k,v])=>[k,...v])}; }
    case 'bic': { const fn=grp==='company'?(r=>coName(r.bicCompany)):grp==='person'?(r=>ctName(r.bicPerson)):(r=>r.bicCategory); const rows=count(fn); return {h:[grp==='company'?'Company':grp==='person'?'Person':'Category','Records'],rows,empty:'Nothing is assigned to a ball-in-court '+(grp||'category')+'.'}; }
    case 'aging': { let rs=base.filter(r=>!CLOSED.includes(r.currentStatus)); if(grp!=='all') rs=rs.filter(r=>map[r.id].dl.some(d=>d[0]==='overdue')); rs.sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')); return {h:['Code','Name','Project','Agency','Status','Days open','Days overdue'],rows:rs.map(r=>[...recRow(r),Math.floor((Date.now()-Date.parse(r.createdAt||r.updatedAt||Date.now()))/864e5),r.dTarget&&daysUntil(r.dTarget)<0?-daysUntil(r.dTarget):'']),empty:'Nothing is overdue in this scope.',rec:rs}; }
    case 'upcoming': { const from=P.from||today(); const to=P.to||new Date(Date.now()+60*864e5).toISOString().slice(0,10); const out=[]; base.forEach(r=>{ if(r.dTarget&&!r.dActual) out.push([r,'Due',r.dTarget]); if(r.setup?.expires!==false&&r.dExpiration) out.push([r,'Expires',r.dExpiration]); if(r.setup?.renewal!==false&&r.dRenewalDue) out.push([r,'Renewal due',r.dRenewalDue]); }); const rs=out.filter(x=>x[2]>=from&&x[2]<=to).sort((a,b)=>a[2].localeCompare(b[2])); return {h:['Date','What','Code','Name','Project','Agency'],rows:rs.map(([r,w,d])=>[fmtD(d),w,r.code,r.name,projName(r.projectId),r.agency]),empty:'Nothing falls due, expires or renews in this window.',note:'A record with two deadlines in the window appears once per deadline.'}; }
    case 'quality': if(grp==='check'){ const o={}; base.forEach(r=>map[r.id].checks.forEach(c=>o[c]=(o[c]||0)+1)); return {h:['Check','Records flagged'],rows:CHECKS.filter(c=>o[c[0]]).map(c=>[c[1],o[c[0]]]),empty:'Every check is clear in this scope.'}; } else { const rows=Object.entries(S.projects).map(([id,p])=>{const rs=base.filter(r=>r.projectId===id);const f=rs.filter(r=>map[r.id].checks.length);const cc={};rs.forEach(r=>map[r.id].checks.forEach(c=>cc[c]=(cc[c]||0)+1));const top=Object.entries(cc).sort((a,b)=>b[1]-a[1])[0];return [p.name,rs.length,f.length,rs.reduce((s,r)=>s+map[r.id].checks.length,0),top?CHECK_LABEL[top[0]]:'—'];}); return {h:['Project','Records','Flagged records','Open flags','Most common check'],rows}; }
    case 'payment': { const out=['Not Yet Paid','Invoice Received','Payment Requested']; if(grp==='status') return {h:['Payment status','Records'],rows:count(r=>r.paymentStatus)}; const rs=base.filter(r=>out.includes(r.paymentStatus)); return {h:['Code','Name','Project','Agency','Status','Payment'],rows:rs.map(r=>[...recRow(r),r.paymentStatus]),empty:'Nothing outstanding. Every fee-bearing record in scope is settled.',note:'Outstanding means Not Yet Paid, Invoice Received or Payment Requested. Refund Pending is money owed the other way.'}; }
  }
}

  ${d.note?`<p style="color:var(--muted);font-size:12.5px">${d.note}</p>`:''}</div></section>`;

// ---------- help ----------
function vHelp(){
  return `<div class="help"><h1>How to use Permit Desk</h1><p class="lede">One place for every NYC permit, filing, approval, inspection and sign-off across your jobs.</p>
  <h2>The idea</h2><ol><li><b>Master catalog</b>: each kind of permit is described once: its agency, its fields, its lifecycle.</li><li><b>Project</b>: create the job and its team of default consultants.</li><li><b>Slate</b>: on the project page, tick every permit type the job needs. Each becomes a record that is Queued and Not Started.</li><li><b>Work it</b>: start an item, fill in dates, numbers and who has the ball, until it is signed off.</li><li><b>Rollups</b>: the Dashboard, Reports and the alert bell add everything up live.</li></ol>
  <h2>Records</h2><p>The Records screen is for finding and scanning. Filters with two values mean "either one"; two different filters mean "both". Pick columns with the Columns menu. Click a row for a summary, then <b>Open full</b> to edit. Only the fields the permit type uses are shown.</p>
  <p>The four "who" fields answer different questions: <b>Ball-in-court</b> is whose turn it is now, <b>Responsible</b> owns it overall, <b>Action owner</b> does the next step, and <b>Agency reviewer</b> is the examiner. People are never filled in for you; use <b>Load all defaults</b> or drop in a team member.</p>
  <h2>Deadlines and data checks</h2><p>Only Active records count. Due within 7 days and Overdue read Target completion; Expiring reads Expiration (60 days); Renewal reads Renewal due (30 days); Stale means nobody touched it in 30 days. Eleven data checks flag records that look wrong, such as Issued with no issue date or nobody ball-in-court.</p>
  <h2>TRs</h2><p>Special inspections are their own agency in the catalog. When every TR on a project has a Final received, the project's "All TRs signed off" line turns satisfied on its own.</p>
  <h2>Rules</h2><ul><li>Companies, contacts and list values are set inactive or retired, never deleted.</li><li>Names and addresses tidy to proper case when you leave the field. Exceptions (HQ, LLC, DOB…) live in Settings.</li><li>All dates are New York time.</li><li>Every change to a record is kept in its History tab.</li></ul>
  <h2>Sharing</h2><p>Use Claude's Share button on this page. Contributors can do all the daily work; owners and editors can also change Settings.</p></div>`;
}

function nextCode(pid,prefix){ let mx=0; recs().forEach(r=>{ if(r.projectId===pid){ const m=(r.code||'').match(new RegExp('^'+prefix+'-(\\d+)$')); if(m) mx=Math.max(mx,+m[1]); }}); return prefix+'-'+String(mx+1).padStart(3,'0'); }
function nextSeq(coll,prefix){ let mx=0; Object.values(S[coll]).forEach(c=>{ const m=(c.code||'').match(/(\d+)$/); if(m) mx=Math.max(mx,+m[1]); }); return prefix+'-'+String(mx+1).padStart(3,'0'); }
function setupFrom(fields){ const f=new Set(fields); return {required:true,renewal:f.has('dRenewalDue'),expires:f.has('dExpiration'),inspection:f.has('dInspection'),signoff:f.has('dSignoff'),payment:f.has('paymentStatus')}; }

async function recUpdate(id,patch,hist){
  const r=S.records[id]; if(!r) return;
  const history=capHist([...(r.history||[]),...hist]);
  await put('records',id,{...patch,history,...stamp()},true);
}
async function addToSlate(pid,codes){
  let made=0;
  for(const code of codes){
    const t=S.catalog[code]; if(!t) continue;
    const id=uidGen(); const prefix=PREFIX[t.agency]||'REC';
    const rec={projectId:pid,catalogCode:code,code:nextCode(pid,prefix),name:t.name,agency:t.agency,category:t.category,kind:t.kind||'Permit',recordStatus:'Queued',currentStatus:'Not Started',description:t.description||'',fields:t.fields||[],setup:setupFrom(t.fields||[]),override:false,bicCategory:t.typicalBic||'',inspections:[],deps:[],history:[H('Created',{note:code+' — '+t.name})],createdAt:new Date().toISOString(),createdBy:uid||'',...stamp()};
    S.records[id]=rec; CMP=null; // so the next code counts it
    if(await put('records',id,rec)) made++;
  }
  return made;
}
async function saveRecord(form){
  const id=S.recId, r=S.records[id]; if(!r) return;
  const patch={}, hist=[];
  form.querySelectorAll('[data-f]').forEach(el=>{ const k=el.dataset.f; const v=el.value.trim(); if((r[k]??'')!==v){ patch[k]=v; const lab=x=>FD[k].type==='company'?coName(x):FD[k].type==='contact'?ctName(x):x; hist.push(H('Changed',{field:k,from:lab(r[k]??''),to:lab(v)})); } });
  const ov=form.querySelector('[data-setup=override]').checked; const setup={...(r.setup||{})}; let sc=false;
  form.querySelectorAll('[data-setup]:not([data-setup=override])').forEach(el=>{ const k=el.dataset.setup; if(!!setup[k]!==el.checked){ setup[k]=el.checked; sc=true; } });
  if(ov!==!!r.override){ patch.override=ov; hist.push(H('Setup',{note:ov?'Override turned on':'Override turned off'})); }
  if(sc){ patch.setup=setup; hist.push(H('Setup',{note:'Setup toggles changed'})); }
  if(patch.recordStatus && patch.recordStatus!==r.recordStatus) hist.forEach(h=>{ if(h.field==='recordStatus') h.type='Status changed'; });
  if(patch.currentStatus) hist.forEach(h=>{ if(h.field==='currentStatus') h.type='Status changed'; });
  S.dirty=false; S.pending=false;
  if(!hist.length){ toast('No changes to save.'); render(); return; }
  if(await recUpdate(id,patch,hist)!==false) toast('Saved');
}
async function renameCascade(listName,from,to){
  const map={'Agency':[['records','agency'],['catalog','agency']],'Permit Category':[['records','category'],['catalog','category']],'Ball-in-Court Category':[['records','bicCategory'],['catalog','typicalBic']],'Priority':[['records','priority']],'Payment Status':[['records','paymentStatus']],'Project Type':[['projects','type']],'Borough':[['projects','borough']],'Company Type':[['companies','type']],'Discipline':[['contacts','discipline']],'Project Role':[['contacts','role']]};
  for(const [coll,field] of (map[listName]||[])){ for(const [id,d] of Object.entries(S[coll])){ if(d[field]===from) await put(coll,id,{[field]:to},true); } }
  if(listName==='Discipline'){ for(const [id,t] of Object.entries(S.catalog)){ if((t.disciplines||[]).includes(from)) await put('catalog',id,{disciplines:t.disciplines.map(x=>x===from?to:x)},true); } for(const [id,p] of Object.entries(S.projects)){ if((p.team||[]).some(m=>m.discipline===from)) await put('projects',id,{team:p.team.map(m=>m.discipline===from?{...m,discipline:to}:m)},true); } }
  if(listName==='Project Type'){ for(const [id,t] of Object.entries(S.catalog)){ if((t.projectTypes||[]).includes(from)) await put('catalog',id,{projectTypes:t.projectTypes.map(x=>x===from?to:x)},true); } }
}

  async vRetire(el){ const L=S.vocab, v=S.cfg.lists[L][+el.dataset.i]; const r=S.cfg.retired?.[L]||[]; await db.doc('config/main').set({...S.cfg,retired:{...(S.cfg.retired||{}),[L]:r.includes(v)?r.filter(x=>x!==v):[...r,v]}}); },
  async vAdd(){ const L=S.vocab, v=$('#vNew').value.trim(); if(!v) return; if(S.cfg.lists[L].includes(v)){ toast('That value already exists.'); return; } await cfgUpdate({lists:{...S.cfg.lists,[L]:[...S.cfg.lists[L],v]}}); toast('Added'); },
  toggleRet(){ S.showRet=!S.showRet; render(); },
  async lsSave(){ const st=S.cfg.statuses.map((s,i)=>[$('#ls_'+i).value.trim()||s[0],$('#lg_'+i).value,...(s[2]?[true]:[])]); S.dirty=false; await db.doc('config/main').set({...S.cfg,statuses:st}); for(let i=0;i<st.length;i++){ const from=S.cfg.statuses[i]?.[0]; if(from&&from!==st[i][0]) for(const [id,r] of Object.entries(S.records)) if(r.currentStatus===from) await put('records',id,{currentStatus:st[i][0]},true); } toast('Lifecycle saved'); },
  async lsAdd(){ const n=$('#lsNew').value.trim(); if(!n) return; await db.doc('config/main').set({...S.cfg,statuses:[...S.cfg.statuses,[n,$('#lgNew').value]]}); },
  async lsRetire(el){ const i=+el.dataset.i; await db.doc('config/main').set({...S.cfg,statuses:S.cfg.statuses.map((s,j)=>j===i?(s[2]?[s[0],s[1]]:[s[0],s[1],true]):s)}); },
};

// ---------- events ----------
const M=$('#main');
M.addEventListener('click',async e=>{
  const t=e.target;
  const a=t.closest('[data-act]'); if(a&&a.tagName!=='INPUT'){ e.preventDefault(); const f=ACT[a.dataset.act]; if(f){ if(!canWrite && !['clearF','clearBicF','groupAg','colReset','exportGrid','exportReport','recBack','recDiscard','emClose','projBack','slateClear','catGroup','typeBack','toggleRet','emailOpen','emDel','emAdd','emCopy'].includes(a.dataset.act)){ toast('You can view this tracker but not change it.'); return; } a.disabled=true; try{ await f(a); } finally{ a.disabled=false; } } return; }
  const nv=t.closest('[data-nav]'); if(nv){ e.preventDefault(); nav(nv.dataset.nav); return; }
  const go=t.closest('[data-go]'); if(go){ e.preventDefault(); goRecords(JSON.parse(go.dataset.go)); return; }
  const op=t.closest('[data-open]'); if(op){ e.preventDefault(); openRec(op.dataset.open); return; }
  const sl=t.closest('[data-sel]'); if(sl){ S.sel=sl.dataset.sel; render(); return; }
  const so=t.closest('[data-sort]'); if(so){ const c=so.dataset.sort; S.sort=S.sort.col===c?{col:c,dir:-S.sort.dir}:{col:c,dir:1}; render(); return; }
  const pj=t.closest('[data-proj]'); if(pj){ S.projId=pj.dataset.proj; S.slateSel=new Set(); render(); window.scrollTo(0,0); return; }
  const ty=t.closest('[data-type]'); if(ty){ S.typeId=ty.dataset.type; render(); window.scrollTo(0,0); return; }
  const rw=t.closest('.list-row[data-row]'); if(rw){ if(S.dirty&&!confirmLeave()) return; S.dirty=false; S.openRow=S.openRow===rw.dataset.row?null:rw.dataset.row; render(); return; }
  const rt=t.closest('[data-rtab]'); if(rt){ S.recTab=rt.dataset.rtab; render(); return; }
  const rp=t.closest('[data-rep]'); if(rp){ S.report=rp.dataset.rep; S.rp.group=''; render(); return; }
  const st=t.closest('[data-stab]'); if(st){ S.setTab=st.dataset.stab; render(); return; }
  const vc=t.closest('[data-vocab]'); if(vc){ S.vocab=vc.dataset.vocab; render(); return; }
});
M.addEventListener('change',async e=>{
  const t=e.target, d=t.dataset;
  if(d.ms){ const arr=S.F[d.ms]; const i=arr.indexOf(t.value); if(t.checked&&i<0) arr.push(t.value); if(!t.checked&&i>=0) arr.splice(i,1); S.sel=null; render(); const det=document.querySelector(`[data-ms="${d.ms}"]`)?.closest('details'); if(det) det.open=true; return; }
  if(d.fsel){ S.F[d.fsel]=t.value; render(); return; }
  if(d.col){ if(t.checked&&!S.cols.includes(d.col)) S.cols.push(d.col); if(!t.checked) S.cols=S.cols.filter(c=>c!==d.col); try{localStorage.setItem('pd.cols',JSON.stringify(S.cols));}catch(err){} render(); const det=document.querySelector('[data-col]')?.closest('details'); if(det) det.open=true; return; }
  if(d.act==='toggleRet'){ S.showRet=t.checked; render(); return; }
  if(d.dash){ S.dash={...(S.dash||{}),[d.dash]:t.value}; render(); return; }
  if(d.sf){ S.slateF[d.sf]=t.value; if(d.sf==='agency') S.slateF.category=''; render(); return; }
  if(d.slate){ t.checked?S.slateSel.add(d.slate):S.slateSel.delete(d.slate); render(); return; }
  if(d.cf){ S.catF[d.cf]=t.type==='checkbox'?t.checked:t.value; render(); return; }
  if(d.rp){ S.rp[d.rp]=t.value; render(); return; }
  if(d.dirinact){ S.dirInactive=t.checked; render(); return; }
  if(d.alert){ const cur=S.me.alertTypes||DEADLINES.map(x=>x[0]); const next=t.checked?[...new Set([...cur,d.alert])]:cur.filter(x=>x!==d.alert); await put(`data/users/${uid}`,'profile',{...S.me,alertTypes:next}); return; }
  if(d.slstat){ const r=S.records[d.slstat]; if(r.currentStatus!==t.value) await recUpdate(d.slstat,{currentStatus:t.value},[H('Status changed',{field:'currentStatus',from:r.currentStatus,to:t.value})]); return; }
  if(d.insp!==undefined){ const r=S.records[S.recId]; const ins=r.inspections.map((x,i)=>i===+d.insp?{...x,result:t.value}:x); await recUpdate(S.recId,{inspections:ins},[H('Inspection result',{note:ins[+d.insp].type+': '+t.value})]); return; }
  if(d.setup==='override'){ document.querySelectorAll('[data-setup]:not([data-setup=override])').forEach(x=>x.disabled=!t.checked); S.dirty=true; return; }
  if(t.id==='dropWho'&&t.value!==''){ const r=S.records[S.recId]; const m=(S.projects[r.projectId]?.team||[])[+t.value]; const w=$('#dropWhich').value; const set=(k,v)=>{const el=document.querySelector(`[data-f=${k}]`); if(el) el.value=v||'';}; if(w==='resp'){ set('respCompany',m.companyId); set('respPerson',m.contactId);} else if(w==='bic'){ set('bicCompany',m.companyId); set('bicPerson',m.contactId);} else set('actionOwner',m.contactId); S.dirty=true; toast('Dropped in. Save to keep it.'); t.value=''; return; }
  if(d.f==='agency'){ const cat=document.querySelector('[data-f=category]'); if(cat){ const cur=cat.value; cat.innerHTML=opts(lists('Permit Category').filter(c=>catScopeOK(c,t.value)),catScopeOK(cur,t.value)?cur:''); } }
  if(d.f==='bicPerson'||d.f==='respPerson'){ const ck=d.f==='bicPerson'?'bicCompany':'respCompany'; const co=document.querySelector(`[data-f=${ck}]`); const c=S.contacts[t.value]; if(co&&c&&!co.value) co.value=c.companyId; }
  if(d.t==='agency'){ const cat=$('#ty_cat'); if(cat){ const cur=cat.value; cat.innerHTML=opts(lists('Permit Category').filter(c=>catScopeOK(c,t.value)),catScopeOK(cur,t.value)?cur:''); } }
  if(d.stage){ const on=t.checked; STAGE_FIELDS[d.stage].forEach(f=>{const c=document.querySelector(`[data-tf=${f}]`); if(c) c.checked=on;}); if(d.stage==='expires'&&!on){ STAGE_FIELDS.renewal.forEach(f=>{const c=document.querySelector(`[data-tf=${f}]`); if(c) c.checked=false;}); const rn=document.querySelector('[data-stage=renewal]'); if(rn){ rn.checked=false; rn.disabled=true; } } if(d.stage==='expires'&&on){ const rn=document.querySelector('[data-stage=renewal]'); if(rn) rn.disabled=false; } S.dirty=true; return; }
  if(d.tf){ const pairs={bicPerson:'bicCompany',respPerson:'respCompany'}; if(t.checked&&pairs[d.tf]) document.querySelector(`[data-tf=${pairs[d.tf]}]`).checked=true; const inv=Object.entries(pairs).find(([,c])=>c===d.tf); if(!t.checked&&inv) document.querySelector(`[data-tf=${inv[0]}]`).checked=false; S.dirty=true; return; }
  if(t.id==='emTpl'){ const r={...S.records[S.recId]}; const tp=S.cfg.templates[+t.value]; S.email.tpl=t.value; if(tp){ S.email.subject=mergeTpl(tp.subject,r); S.email.body=mergeTpl(tp.body,r); } render(); return; }
  if(t.closest('form[data-form]')) S.dirty=true;
});
M.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(d.dirq){ S.dirQ=t.value; render(); return; }
  if(d.cf==='q'){ S.catF.q=t.value; render(); return; }
  if(d.sf==='q'){ S.slateF.q=t.value; render(); return; }
  if(t.id==='emSubj'||t.id==='emBody'){ S.email[t.id==='emSubj'?'subject':'body']=t.value; const e2=S.email; $('#emAll').value=`To: ${e2.to.join(', ')}\nSubject: ${e2.subject}\n\n${e2.body}`; const b=document.querySelector('[data-act=emCopy]'); if(b) b.disabled=!(e2.subject&&e2.to.length); return; }
  if(d.tpl!==undefined||d.vv!==undefined||d.ls!==undefined){ S.dirty=true; return; }
  if(t.closest('form[data-form]')) S.dirty=true;
});
M.addEventListener('focusout',e=>{ const t=e.target; if(t.dataset&&t.dataset.cap&&!t.dataset.capped&&t.value){ const v=smartCap(t.value); if(v!==t.value){ t.value=v; t.style.transition='background .4s'; t.style.background='var(--accent-soft)'; setTimeout(()=>t.style.background='',450); } t.dataset.capped='1'; } });
M.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target; const k=f.dataset.form; if(!canWrite){ toast('You can view this tracker but not change it.'); return; }
  const btn=f.querySelector('[type=submit]'); if(btn) btn.disabled=true;
  try{
  if(k==='rec') return await saveRecord(f);
  if(k==='proj'||k==='projEdit'){ const d={}; f.querySelectorAll('[data-p]').forEach(el=>d[el.dataset.p]=el.value.trim()); if(!d.name){ toast('Name the project.'); return; }
    S.dirty=false; if(k==='proj'){ const id=uidGen(); if(await put('projects',id,{...d,status:'Active',team:[],createdAt:new Date().toISOString(),...stamp()})){ S.newProject=false; S.projId=id; render(); toast('Project created. Add its team and slate.'); } } else { if(await put('projects',S.projId,{...d,...stamp()},true)) toast('Project saved'); } return; }
  if(k==='type'){ const isNew=S.typeId==='__new'; const t0=isNew?{}:S.catalog[S.typeId]; const d={}; f.querySelectorAll('[data-t]').forEach(el=>{ let v=el.value.trim(); if(el.type==='number') v=v===''?null:+v; d[el.dataset.t]=v; });
    if(!d.name){ toast('Name the type.'); return; } if(!d.agency){ toast('Pick an agency.'); return; }
    const fields=FIELDS.filter(x=>x[4]||f.querySelector(`[data-tf=${x[0]}]`)?.checked).map(x=>x[0]);
    d.fields=fields; d.disciplines=[...f.querySelectorAll('[data-tdisc]:checked')].map(x=>x.dataset.tdisc); d.projectTypes=[...f.querySelectorAll('[data-tpt]:checked')].map(x=>x.dataset.tpt);
    d.testing=!!f.querySelector('[data-stage=testing]')?.checked;
    const rev=$('#ty_reviewed').checked; d.review=rev?'reviewed':(t0.review==='reviewed'?'auto':(t0.review||'unreviewed')); d.active=$('#ty_active').checked;
    let code=isNew?(d.code||''):S.typeId; if(isNew){ if(!code){ let mx=0; Object.keys(S.catalog).forEach(c=>{const m=c.match(/^CAT-(\d+)$/); if(m) mx=Math.max(mx,+m[1]);}); code='CAT-'+String(mx+1).padStart(3,'0'); } if(S.catalog[code]){ toast('That catalog code is already used.'); return; } if(!/^[A-Za-z0-9_\-.]+$/.test(code)){ toast('Codes use letters, digits and dashes.'); return; } }
    d.code=code; d.kind=t0.kind||'Permit'; d.inspectionTypes=t0.inspectionTypes||[]; S.dirty=false;
    if(await put('catalog',code,{...t0,...d})){ toast(rev?'Saved and marked reviewed':'Saved'); S.typeId=code; render(); } return; }
  if(k==='co'||k==='ct'){ const id=f.dataset.id; const coll=k==='co'?'companies':'contacts'; const d={}; f.querySelectorAll('[data-c]').forEach(el=>d[el.dataset.c]=el.type==='checkbox'?el.checked:el.value.trim()); if(!d.name){ toast('Enter a name.'); return; } if(k==='ct'&&!d.companyId){ toast('Every contact must belong to a company.'); return; }
    S.dirty=false; if(id==='__new'){ const nid=uidGen(); if(await put(coll,nid,{...d,code:nextSeq(coll,k==='co'?'C':'K'),active:true,createdAt:new Date().toISOString()})){ toast(k==='co'?'Company added':'Contact added'); f.reset(); S.openRow=nid; } } else { if(await put(coll,id,d,true)) toast('Saved'); } return; }
  } finally { if(btn) btn.disabled=false; }
});
document.addEventListener('click',e=>{ const nv=e.target.closest('#nav [data-nav]'); if(nv){ e.preventDefault(); nav(nv.dataset.nav); } });
document.addEventListener('change',async e=>{ if(e.target.id!=='pdRestore') return; const f=e.target.files[0]; if(!f) return; if(!confirm('Replace everything in the tracker with "'+f.name+'"?')){ e.target.value=''; return; } try{ await window.PD_STORE.importAll(JSON.parse(await f.text())); toast('Restored from backup'); }catch(err){ toast('Could not restore: '+err.message); } e.target.value=''; });
boot();
</script>
