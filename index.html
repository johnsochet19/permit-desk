<script>window.PD_MODE="supabase";window.PD_SB={url:"https://kxscczhqvkmrwmhnpjuj.supabase.co",key:"sb_publishable_rhR5n-nq6xNw1JVLP1SBxQ_MuexWAPJ"};</script>
<script>/* Permit Desk storage layer: runs the app without Claude.
   MODE "local"  -> everything is saved in this browser (localStorage).
   MODE "remote" -> everything is saved online through /api/data (password protected). */
(function(){
  const MODE = window.PD_MODE || 'local';
  const LS_KEY = 'permitdesk-data-v1';
  const docs = new Map();            // path -> data
  const docL = new Map();            // path -> Set(listener)
  const colL = new Map();            // collection -> Set(listener)
  let version = 0, ready = null;

  const clone = v => v==null ? v : JSON.parse(JSON.stringify(v));
  const isTop = (path, coll) => { const p = path.split('/'); return p.length===2 && p[0]===coll; };
  function snapDoc(path){ const d = docs.get(path); return { id: path.split('/').pop(), exists: d!==undefined, data: ()=>clone(d), metadata:{fromCache:false} }; }
  function snapCol(coll){ const out=[]; docs.forEach((d,p)=>{ if(isTop(p,coll)) out.push({id:p.split('/')[1], data:()=>clone(d)}); }); return {docs:out, size:out.length, empty:!out.length, metadata:{fromCache:false}}; }
  function emit(paths){
    const colls = new Set();
    paths.forEach(p=>{ (docL.get(p)||[]).forEach(cb=>{ try{cb(snapDoc(p));}catch(e){console.error(e);} }); const s=p.split('/'); if(s.length===2) colls.add(s[0]); });
    colls.forEach(c=>(colL.get(c)||[]).forEach(cb=>{ try{cb(snapCol(c));}catch(e){console.error(e);} }));
  }
  function emitAll(){ emit([...new Set([...docs.keys(), ...docL.keys()])]); colL.forEach((s,c)=>s.forEach(cb=>cb(snapCol(c)))); }
  function applyOps(ops){
    ops.forEach(o=>{
      if(o.op==='delete') docs.delete(o.path);
      else if(o.op==='update'){ if(!docs.has(o.path)) throw Object.assign(new Error('Not found'),{code:'not-found'}); docs.set(o.path, {...docs.get(o.path), ...clone(o.data)}); }
      else docs.set(o.path, clone(o.data));
    });
  }
  function seedDocs(){ const el=document.getElementById('pd-seed'); return el ? JSON.parse(el.textContent) : {}; }

  /* ---------- local backend ---------- */
  function localSave(){
    const obj={}; docs.forEach((d,p)=>obj[p]=d);
    try{ localStorage.setItem(LS_KEY, JSON.stringify({version, docs:obj})); }
    catch(e){ alert('This browser could not save your changes (storage full or blocked). Use Backup to download a copy.'); throw e; }
  }
  async function localLoad(){
    let raw=null; try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
    const st = raw ? JSON.parse(raw) : {version:1, docs:seedDocs()};
    version = st.version||1; Object.entries(st.docs).forEach(([p,d])=>docs.set(p,d));
    if(!raw) localSave();
    window.addEventListener('storage', e=>{ if(e.key===LS_KEY && e.newValue){ const st=JSON.parse(e.newValue); docs.clear(); Object.entries(st.docs).forEach(([p,d])=>docs.set(p,d)); version=st.version; emitAll(); } });
  }

  /* ---------- remote backend ---------- */
  const auth = () => { try{ return JSON.parse(localStorage.getItem('permitdesk-login')||'null'); }catch(e){ return null; } };
  async function api(method, body){
    if(MODE==='github') return ghApi(method, body);
    if(MODE==='supabase') return sbApi(method, body);
    const a = auth();
    const r = await fetch('/api/data'+(method==='GET'?'?v='+version:''), {method, cache:'no-store', headers:{'content-type':'application/json','x-pd-pass':a?.pass||''}, body: body?JSON.stringify(body):undefined});
    if(r.status===401){ localStorage.removeItem('permitdesk-login'); location.reload(); throw new Error('Wrong password'); }
    if(!r.ok) throw new Error((await r.text())||('Server error '+r.status));
    return r.json();
  }

  /* ---------- GitHub backend: data.json in a private repo; every save is a commit ---------- */
  const GH = Object.assign({owner:'johnsochet19', repo:'permit-desk-data', path:'data.json', branch:'main', api:'https://api.github.com'}, window.PD_GH||{});
  const ghBase = () => `${GH.api}/repos/${GH.owner}/${GH.repo}`;
  async function gh(url, opts={}, token){
    const r = await fetch(url.startsWith('http')?url:ghBase()+url, {...opts, cache:'no-store', headers:{'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Authorization':'Bearer '+(token||auth()?.pass||''), ...(opts.headers||{})}});
    if(r.status===401 && !token){ localStorage.removeItem('permitdesk-login'); alert('Your GitHub access key stopped working (expired or revoked). Sign in again with a new one.'); location.reload(); throw new Error('Bad key'); }
    return r;
  }
  const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')), c=>c.charCodeAt(0)));
  function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
  function serialize(obj){ const keys=Object.keys(obj).sort(); return '{"app":"Permit Desk","docs":{\n'+keys.map(k=>JSON.stringify(k)+':'+JSON.stringify(obj[k])).join(',\n')+'\n}}\n'; }
  async function ghRead(){
    const r = await gh(`/contents/${GH.path}?ref=${GH.branch}`);
    if(r.status===404) return {sha:null, docs:{}};
    if(!r.ok) throw new Error('GitHub said '+r.status+' reading the data');
    const m = await r.json(); let b64 = m.content;
    if(!b64 || !b64.trim()){ const r2 = await gh(`/git/blobs/${m.sha}`); if(!r2.ok) throw new Error('GitHub said '+r2.status+' reading the data'); b64=(await r2.json()).content; }
    return {sha:m.sha, docs:JSON.parse(b64dec(b64)).docs||{}};
  }
  function describe(ops, docs){
    const o=ops[0]; if(!o) return 'Update'; const d={...(docs&&docs[o.path]||{}), ...(o.data||{})};
    const proj = d.projectId && docs ? docs['projects/'+d.projectId]?.name : ''; const what = (d.code&&d.name ? `${d.code} ${d.name}` : (d.name || o.path)) + (proj?` (${proj})`:'');
    return (o.op==='delete'?'Delete ':'Update ')+what+(ops.length>1?` (+${ops.length-1} more)`:'');
  }
  async function ghApi(method, body){
    if(method==='GET'){ const st=await ghRead(); return {version:st.sha||0, docs:st.docs}; }
    for(let attempt=0; attempt<5; attempt++){
      const st = await ghRead(); const d = st.docs;
      if(body.replace) Object.keys(d).forEach(k=>delete d[k]), Object.assign(d, body.replace);
      else for(const o of body.ops||[]){ if(o.op==='delete') delete d[o.path]; else if(o.op==='update') d[o.path]={...(d[o.path]||{}),...o.data}; else d[o.path]=o.data; }
      const msg = `${auth()?.name||'Someone'}: ${body.replace?'Restore from backup':describe(body.ops||[], d)}`;
      const r = await gh(`/contents/${GH.path}`, {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify({message:msg, content:b64enc(serialize(d)), branch:GH.branch, ...(st.sha?{sha:st.sha}:{})})});
      if(r.status===409 || r.status===422){ await new Promise(res=>setTimeout(res, 400*(attempt+1))); continue; }
      if(!r.ok) throw new Error('GitHub said '+r.status+' saving: '+((await r.json().catch(()=>({}))).message||''));
      return {version:(await r.json()).content.sha};
    }
    throw new Error('Someone else kept saving at the same moment; try again');
  }

  /* ---------- Supabase backend: email accounts, invites, live updates ---------- */
  const SB = Object.assign({url:'', key:''}, window.PD_SB||{});
  let sbReady=false, sb=null, sbUser=null, sbRole=null, sbMembers=[], sbInvites=[], sbChannel=null;
  const esc2 = v => String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function sbFn(name, body){
    const { data:{ session } } = await sb.auth.getSession();
    const r = await fetch(`${SB.url}/functions/v1/${name}`, {method:'POST', headers:{'content-type':'application/json', apikey:SB.key, ...(session?{authorization:'Bearer '+session.access_token}:{})}, body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({error:'Unexpected reply ('+r.status+')'}));
    if(!r.ok || j.error) throw new Error(j.error || ('Error '+r.status));
    return j;
  }
  async function sbAll(){
    const out={}; for(let from=0;;from+=1000){
      const { data, error } = await sb.from('docs').select('path,data').order('path').range(from, from+999);
      if(error) throw error; data.forEach(r=>out[r.path]=r.data); if(data.length<1000) break; }
    return out;
  }
  async function sbRefreshPeople(){
    const m = await sb.from('members').select('user_id,email,name,role,created_at').order('created_at');
    if(!m.error) sbMembers = m.data;
    const me = sbMembers.find(x=>x.user_id===sbUser?.id); sbRole = me?.role || null;
    if(sbRole==='admin'){ const i = await sb.from('invites').select('code,email,role,created_at,expires_at,used_at').is('used_at',null).order('created_at',{ascending:false}); if(!i.error) sbInvites = i.data.filter(x=>new Date(x.expires_at)>new Date()); }
  }
  async function sbApi(method, body){
    if(method==='GET') return {version:Date.now(), docs:await sbAll()};
    if(body.replace){ const { error } = await sb.rpc('docs_replace', {p_docs: body.replace}); if(error) throw new Error(error.message); return {version:Date.now()}; }
    for(const o of body.ops||[]){
      let r;
      if(o.op==='delete') r = await sb.from('docs').delete().eq('path', o.path);
      else if(o.op==='update') r = await sb.rpc('doc_merge', {p_path:o.path, p_patch:o.data});
      else r = await sb.from('docs').upsert({path:o.path, data:o.data});
      if(r.error) throw new Error(r.error.message);
    }
    return {version:Date.now()};
  }
  function sbSubscribe(){
    sbChannel = sb.channel('permit-desk')
      .on('postgres_changes', {event:'*', schema:'public', table:'docs'}, p=>{
        if(p.eventType==='DELETE'){ if(!p.old?.path) return; docs.delete(p.old.path); emit([p.old.path]); }
        else { docs.set(p.new.path, p.new.data); emit([p.new.path]); }
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'members'}, async ()=>{ await sbRefreshPeople(); window.render?.(); })
      .subscribe();
    // Safety net if the live connection drops: full refresh when the tab comes back.
    document.addEventListener('visibilitychange', async ()=>{ if(document.hidden) return; try{ replaceAll(await sbAll()); emitAll(); }catch(e){} });
  }
  function card(inner){ return `<div style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg,#F4F5F9);color:var(--fg,#111827);font:14px var(--font,Inter,system-ui,sans-serif);overflow:auto;padding:16px"><div class="pdcard" style="background:var(--surface,#fff);border:1px solid var(--line,#E6E8EF);border-radius:var(--radius-lg,12px);box-shadow:var(--shadow-card);padding:28px;width:min(400px,92vw);display:flex;flex-direction:column;gap:12px">${inner}</div></div>`; }
  const fld = (label, name, type='text', extra='') => `<label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted,#4B5563)">${label}<input name="${name}" type="${type}" ${extra} style="font:inherit;padding:8px 10px;border:1px solid var(--line,#E6E8EF);background:var(--surface,#fff);color:var(--fg,#111827);border-radius:var(--radius-sm,6px)"></label>`;
  const btnS = 'font:inherit;padding:9px;border:0;border-radius:6px;background:var(--accent,#3F51E0);color:var(--on-accent,#fff);font-weight:500;cursor:pointer';
  function sbGate(){
    return new Promise(resolve=>{
      const box=document.createElement('div'); document.body.appendChild(box);
      const join = new URLSearchParams(location.search).get('join');
      const finish = ()=>{ box.remove(); resolve(); };
      async function afterSignIn(){
        const { data:{ user } } = await sb.auth.getUser(); sbUser=user;
        if(!user){ await sb.auth.signOut({scope:'local'}); showLogin('Your sign-in has expired or this account was removed. Sign in again.'); return; }
        await sbRefreshPeople();
        if(!sbRole){ box.innerHTML = card(`<h2 style="margin:0;font-size:20px">Permit Desk</h2><p style="margin:0">You're signed in as <b>${esc2(user?.email)}</b>, but this account hasn't been added to the tracker. Ask an admin to invite you.</p><button data-x="out" style="${btnS}">Sign out</button>`); box.querySelector('[data-x=out]').onclick=async()=>{ await sb.auth.signOut(); location.reload(); }; return; }
        finish();
      }
      function showLogin(msg=''){
        box.innerHTML = card(`<h2 style="margin:0;font-size:20px">Permit Desk</h2>${fld('Email','e','email','autocomplete="username" required')}${fld('Password','p','password','autocomplete="current-password" required')}<button data-x="in" style="${btnS}">Sign in</button><small class="err" style="color:#b3362c">${esc2(msg)}</small><small style="color:#5d665f">Forgot your password? Ask your admin to set a temporary one. New here? Use the invite link you were sent.</small>`);
        const go = async()=>{ const e=box.querySelector('[name=e]').value.trim(), p=box.querySelector('[name=p]').value; const err=box.querySelector('.err'); err.textContent='Signing in…';
          const { error } = await sb.auth.signInWithPassword({email:e, password:p}); if(error){ err.textContent = /invalid/i.test(error.message)?'That email and password don\'t match.':error.message; return; } await afterSignIn(); };
        box.querySelector('[data-x=in]').onclick=go; box.querySelectorAll('input').forEach(i=>i.onkeydown=ev=>{ if(ev.key==='Enter') go(); });
      }
      async function showJoin(){
        box.innerHTML = card('<p style="margin:0">Checking your invite…</p>');
        let inv; try{ inv = await sbFn('accept-invite', {action:'check', code:join}); }catch(e){ box.innerHTML = card(`<h2 style="margin:0;font-size:20px">Permit Desk</h2><p style="margin:0;color:#b3362c">${esc2(e.message)}</p><a href="${location.pathname}" style="color:#1f3b57">Go to sign in</a>`); return; }
        box.innerHTML = card(`<h2 style="margin:0;font-size:20px">Join Permit Desk</h2><p style="margin:0;color:#5d665f">You've been invited${inv.role==='admin'?' as an admin':''}. Create your account to get in.</p>${fld('Your name','n','text','autocomplete="name" required')}${fld('Email','e','email',`autocomplete="username" required ${inv.email?`value="${esc2(inv.email)}" readonly`:''}`)}${fld('Choose a password (8+ characters)','p','password','autocomplete="new-password" required minlength="8"')}<button data-x="join" style="${btnS}">Create account</button><small class="err" style="color:#b3362c"></small>`);
        box.querySelector('[data-x=join]').onclick = async()=>{ const n=box.querySelector('[name=n]').value.trim(), e=box.querySelector('[name=e]').value.trim(), p=box.querySelector('[name=p]').value; const err=box.querySelector('.err');
          if(!n){ err.textContent='Enter your name.'; return; } err.textContent='Creating your account…';
          try{ await sbFn('accept-invite', {code:join, email:e, password:p, name:n}); }catch(x){ err.textContent=x.message; return; }
          const { error } = await sb.auth.signInWithPassword({email:e, password:p}); if(error){ err.textContent=error.message; return; }
          // remember the name for emails/history and drop the code from the address bar
          history.replaceState(null,'',location.pathname+location.hash);
          await afterSignIn(); };
      }
      (async()=>{
        if(join) return showJoin();
        const { data:{ session } } = await sb.auth.getSession();
        if(session) return afterSignIn(); showLogin();
      })();
    });
  }
  async function sbStart(){
    if(!window.supabase?.createClient) throw new Error('Could not load the sign-in library. Check your connection and reload.');
    sb = window.supabase.createClient(SB.url, SB.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
    sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT' && sbReady) location.reload(); });
    await sbGate();
    replaceAll(await sbAll());
    sbSubscribe(); sbReady=true;
  }

  /* ---------- Users screen (Settings → Users) ---------- */
  function siteLink(code){ return location.origin + location.pathname + '?join=' + code; }
  function usersView(){
    const admin = sbRole==='admin';
    const meId = sbUser?.id;
    const rows = sbMembers.map(m=>`<tr><td><b>${esc2(m.name||'—')}</b>${m.user_id===meId?' <span class="pill">You</span>':''}<br><small style="color:var(--muted)">${esc2(m.email)}</small></td><td>${admin&&m.user_id!==meId?`<select data-pdu-role="${m.user_id}" style="width:auto"><option value="member"${m.role==='member'?' selected':''}>Member</option><option value="admin"${m.role==='admin'?' selected':''}>Admin</option></select>`:(m.role==='admin'?'Admin':'Member')}</td><td><small style="color:var(--muted)">${new Date(m.created_at).toLocaleDateString()}</small></td><td style="white-space:nowrap">${admin&&m.user_id!==meId?`<button class="btn sm" data-pdu="pw" data-id="${m.user_id}">Set temporary password</button> <button class="btn sm" data-pdu="rm" data-id="${m.user_id}">Remove</button>`:''}</td></tr>`).join('');
    const inv = sbInvites.map(i=>`<tr><td>${esc2(i.email||'Anyone with the link')}</td><td>${i.role==='admin'?'Admin':'Member'}</td><td><small style="color:var(--muted)">expires ${new Date(i.expires_at).toLocaleDateString()}</small></td><td style="white-space:nowrap"><button class="btn sm" data-pdu="copy" data-code="${i.code}">Copy link</button> <a class="btn sm" target="_blank" rel="noopener" href="${gmailFor(i.code,i.email||'')}">Open in Gmail</a> <button class="btn sm" data-pdu="mail" data-code="${i.code}" data-email="${esc2(i.email||'')}">Email it</button> <button class="btn sm" data-pdu="unv" data-code="${i.code}">Cancel</button></td></tr>`).join('');
    return `${admin?`<section class="sec"><header><h3>Invite someone</h3></header><div class="bd stack"><div class="fields"><label class="f">Their email<input type="email" id="pduEmail" placeholder="name@company.com"></label><label class="f">Role<select id="pduRole"><option value="member">Member: works on every project</option><option value="admin">Admin: also manages people and settings</option></select></label><div style="align-self:end"><button class="btn pri" data-pdu="invite">Create invite</button></div></div><small style="color:var(--muted)">You'll get a sign-up link to send them. They open it, choose a password and they're in. Links work once and expire after 14 days.</small><div id="pduNew"></div></div></section>`:''}
    <section class="sec"><header><h3>People · ${sbMembers.length}</h3></header><div class="bd"><table><thead><tr><th>Name</th><th>Role</th><th>Joined</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
    ${admin&&sbInvites.length?`<section class="sec"><header><h3>Invites waiting · ${sbInvites.length}</h3></header><div class="bd"><table><tbody>${inv}</tbody></table></div></section>`:''}
    <section class="sec"><header><h3>Your password</h3></header><div class="bd fields"><label class="f">New password (8+ characters)<input type="password" id="pduMyPw" autocomplete="new-password"></label><div style="align-self:end"><button class="btn" data-pdu="mypw">Change my password</button></div></div></section>
    <div id="pduPanel"></div>`;
  }
  function mailFor(code, email){
    const link = siteLink(code);
    const subject = 'You\'re invited to Permit Desk';
    const body = `Hi,\n\nI've added you to Permit Desk, our permit and filing tracker.\n\nOpen this link to create your account (it works once and expires in 14 days):\n${link}\n\nAfter that, sign in any time at ${location.origin+location.pathname}\n\nThanks`;
    return `mailto:${encodeURIComponent(email||'')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }
  function gmailFor(code, email){
    const u = new URL(mailFor(code, email));
    return `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email||'')}&su=${encodeURIComponent(u.searchParams.get('subject')||'')}&body=${encodeURIComponent(u.searchParams.get('body')||'')}`;
  }
  const say = (m)=> (window.toast ? window.toast(m) : console.log(m));
  async function copy(text){ try{ await navigator.clipboard.writeText(text); say('Link copied'); }catch(e){ window.prompt('Copy this link:', text); } }
  document.addEventListener('click', async e=>{
    const b = e.target.closest('[data-pdu]'); if(!b || MODE!=='supabase') return; e.preventDefault();
    const a = b.dataset.pdu; const panel = document.getElementById('pduPanel');
    try{
      if(a==='invite'){
        const email = (document.getElementById('pduEmail').value||'').trim().toLowerCase() || null;
        if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ say('That email doesn\'t look right.'); return; }
        const role = document.getElementById('pduRole').value;
        const { data, error } = await sb.from('invites').insert({email, role, invited_by: sbUser.id}).select('code').single();
        if(error) throw error;
        await sbRefreshPeople(); window.render?.();
        const link = siteLink(data.code);
        const box = document.getElementById('pduNew');
        if(box) box.innerHTML = `<div class="card stack"><b>Invite ready${email?` for ${esc2(email)}`:''}</b><input type="text" readonly value="${esc2(link)}" onclick="this.select()"><div class="row"><a class="btn pri" target="_blank" rel="noopener" href="${gmailFor(data.code,email)}">Open in Gmail</a><a class="btn" href="${mailFor(data.code,email)}">Email it from my mail app</a><button class="btn" data-pdu="copy" data-code="${data.code}">Copy link</button></div></div>`;
      }
      if(a==='copy') await copy(siteLink(b.dataset.code));
      if(a==='mail') location.href = mailFor(b.dataset.code, b.dataset.email);
      if(a==='unv'){ const { error } = await sb.from('invites').delete().eq('code', b.dataset.code); if(error) throw error; await sbRefreshPeople(); window.render?.(); say('Invite cancelled'); }
      if(a==='pw'){ const m = sbMembers.find(x=>x.user_id===b.dataset.id); const temp = Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('')+'-'+(100+crypto.getRandomValues(new Uint16Array(1))[0]%900);
        await sbFn('admin-users', {action:'set-password', user_id:b.dataset.id, password:temp});
        if(panel) panel.innerHTML = `<div class="card stack"><b>Temporary password for ${esc2(m?.name||m?.email)}</b><input type="text" readonly value="${esc2(temp)}" onclick="this.select()"><small style="color:var(--muted)">Send it to them. They can change it under Settings → Users → Your password.</small></div>`; }
      if(a==='rm'){ const m = sbMembers.find(x=>x.user_id===b.dataset.id);
        if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='Click again to remove'; setTimeout(()=>{ b.dataset.sure=''; b.textContent='Remove'; },4000); return; }
        await sbFn('admin-users', {action:'remove', user_id:b.dataset.id}); await sbRefreshPeople(); window.render?.(); say(`Removed ${m?.name||m?.email}`); }
      if(a==='mypw'){ const p=document.getElementById('pduMyPw').value; if(p.length<8){ say('Use at least 8 characters.'); return; } const { error } = await sb.auth.updateUser({password:p}); if(error) throw error; document.getElementById('pduMyPw').value=''; say('Password changed'); }
    }catch(x){ say('Could not do that: '+(x.message||x)); }
  }, true);
  document.addEventListener('change', async e=>{
    const sel = e.target.closest('[data-pdu-role]'); if(!sel || MODE!=='supabase') return;
    const { error } = await sb.from('members').update({role: sel.value}).eq('user_id', sel.dataset.pduRole);
    if(error){ say('Could not change the role: '+error.message); }
    else say('Role updated');
    await sbRefreshPeople(); window.render?.();
  }, true);

  function replaceAll(obj){ docs.clear(); Object.entries(obj).forEach(([p,d])=>docs.set(p,d)); }
  async function remoteLoad(){
    if(MODE==='supabase') return sbStart();
    const res = await api('GET'); version=res.version; replaceAll(res.docs);
    setInterval(async()=>{ if(document.hidden) return; try{ const res=await api('GET'); if(res.docs && res.version!==version){ version=res.version; replaceAll(res.docs); emitAll(); } }catch(e){} }, MODE==='github'?20000:15000);
  }
  let queue = Promise.resolve();
  function write(ops){
    applyOps(ops); emit(ops.map(o=>o.path));
    if(MODE==='local'){ version++; localSave(); return Promise.resolve(); }
    const p = queue.then(()=>api('POST',{ops})).then(res=>{ version=res.version; });
    queue = p.catch(()=>{});
    return p.catch(e=>{ alert('Your last change was not saved online: '+e.message+'\nReloading to show what is saved.'); location.reload(); throw e; });
  }

  /* ---------- Firestore-like surface used by the app ---------- */
  const db = {
    doc(path){ return {
      onSnapshot(cb, err){ ready.then(()=>cb(snapDoc(path)), err); if(!docL.has(path)) docL.set(path,new Set()); docL.get(path).add(cb); return ()=>docL.get(path).delete(cb); },
      async get(){ await ready; return snapDoc(path); },
      async set(data){ await ready; return write([{op:'set',path,data}]); },
      async update(data){ await ready; return write([{op:'update',path,data}]); },
      async delete(){ await ready; return write([{op:'delete',path}]); }
    }; },
    collection(c){ return {
      onSnapshot(cb, err){ ready.then(()=>cb(snapCol(c)), err); if(!colL.has(c)) colL.set(c,new Set()); colL.get(c).add(cb); return ()=>colL.get(c).delete(cb); }
    }; }
  };
  const me = () => MODE==='local' ? {id:'me', name:'You'} : MODE==='supabase' ? {id:sbUser?.id||'user', name:(sbMembers.find(x=>x.user_id===sbUser?.id)?.name)||sbUser?.email||'User'} : (auth()||{id:'user',name:'User'});
  const user = {
    async id(){ await ready; return me().id; }, async can(){ return true; }, async canEdit(){ await ready; return MODE==='supabase' ? sbRole==='admin' : true; },
    async profiles(ids){ const o={}; ids.forEach(i=>{ const p=docs.get(`data/users/${i}/profile`); const mm = sbMembers.find(x=>x.user_id===i); o[i]={name:p?.name || mm?.name || (i===me().id?me().name:i.replace(/^u-/,'').replace(/-/g,' '))}; }); return o; }
  };
  const downloads = { async save({filename,data}){ const b=new Blob([data],{type:/\.csv$/i.test(filename)?'text/csv':'application/octet-stream'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); return {status:'saved'}; } };

  window.PD_STORE = {
    mode: MODE,
    exportAll(){ const obj={}; docs.forEach((d,p)=>obj[p]=d); return {app:'Permit Desk', exportedAt:new Date().toISOString(), docs:obj}; },
    async importAll(obj){ if(!obj||!obj.docs) throw new Error('Not a Permit Desk backup file');
      if(MODE==='local'){ replaceAll(obj.docs); version++; localSave(); emitAll(); return; }
      const res = await api('POST',{replace:obj.docs}); version=res.version; replaceAll(obj.docs); emitAll(); },
    logout(){ if(MODE==='supabase'){ sb.auth.signOut(); return; } localStorage.removeItem('permitdesk-login'); location.reload(); },
    usersView, get role(){ return sbRole; }
  };

  function loginGate(){
    return new Promise(resolve=>{
      if(auth()) return resolve();
      const isGh = MODE==='github';
      const box=document.createElement('div');
      box.innerHTML=`<div style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f3f4f2;font:15px -apple-system,Segoe UI,Arial,sans-serif">
        <form style="background:#fff;border:1px solid #d5d9d2;border-radius:8px;padding:24px;width:min(400px,92vw);display:flex;flex-direction:column;gap:12px">
          <h2 style="margin:0;font-size:20px">Permit Desk</h2>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5d665f">Your name<input name="n" required autocomplete="name" style="font:inherit;padding:8px;border:1px solid #b8beb4;border-radius:6px"></label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5d665f">${isGh?'GitHub access key':'Password'}<input name="p" type="password" required autocomplete="off" style="font:inherit;padding:8px;border:1px solid #b8beb4;border-radius:6px"></label>
          ${isGh?`<small style="color:#5d665f;line-height:1.4">A fine-grained GitHub token with read and write access to <b>${GH.owner}/${GH.repo}</b> (Contents). It stays in this browser and is only sent to GitHub.</small>`:''}
          <button style="font:inherit;padding:9px;border:0;border-radius:6px;background:#1f3b57;color:#fff;cursor:pointer">Sign in</button>
          <small class="err" style="color:#b3362c"></small></form></div>`;
      document.body.appendChild(box);
      box.querySelector('form').onsubmit=async e=>{ e.preventDefault(); const f=e.target; const name=f.n.value.trim(), pass=f.p.value.trim(); const err=f.querySelector('.err'); err.textContent='Checking…';
        try{
          if(isGh){
            const r=await gh('', {}, pass);
            if(r.status===401){ err.textContent='GitHub did not accept that key.'; return; }
            if(r.status===404){ err.textContent=`GitHub didn't accept that key for ${GH.owner}/${GH.repo}. Check you copied the whole key and gave it access to that repository.`; return; }
            const j=await r.json(); if(j.permissions && !j.permissions.push){ err.textContent='That key can read but not save. Give it Contents: Read and write.'; return; }
          } else {
            const r=await fetch('/api/data?check=1',{headers:{'x-pd-pass':pass},cache:'no-store'});
            if(r.status===401){ err.textContent='That password is not right.'; return; }
          }
        }catch(x){ err.textContent='Could not reach '+(isGh?'GitHub':'the server')+'. Check your connection.'; return; }
        localStorage.setItem('permitdesk-login', JSON.stringify({name, pass, id:'u-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}));
        box.remove(); resolve(); };
    });
  }

  ready = (async()=>{ if(MODE==='supabase') await sbStart(); else if(MODE==='remote'||MODE==='github'){ await loginGate(); await remoteLoad(); } else await localLoad(); })();
  ready.catch(e=>{ document.body.insertAdjacentHTML('afterbegin', `<p style="padding:16px;color:#b3362c">Could not load your data: ${String(e.message||e)}</p>`); });
  window.claude = { use: async name => name==='db'?db : name==='user'?user : name==='downloads'?downloads : null };
})();
</script>

<style>

<script>
// ---------- constants ----------
const FIELDS = [
 ['code','Record code','text','Identity',1],['name','Name','text','Identity',1],['agency','Agency','agency','Identity',1],['category','Category','category','Identity',1],['kind','Kind','kind','Identity',1],['recordStatus','Record status','recstatus','Identity',1],['description','Description','textarea','Identity'],
 ['officialId','Official agency ID','text','Reference numbers'],['applicationNo','Application #','text','Reference numbers'],['jobNo','Job #','text','Reference numbers'],['relatedJob','Related DOB job #','text','Reference numbers'],['deviceNo','Device #','text','Reference numbers'],['trackingNo','Tracking #','text','Reference numbers'],['bin','BIN','text','Reference numbers'],
 ['dInitialFiling','Initial filing','date','Dates'],['dSubmission','Submission','date','Dates'],['dResubmission','Resubmission','date','Dates'],['dApproval','Approval','date','Dates'],['dIssue','Issue','date','Dates'],['dEffective','Effective','date','Dates'],['dExpiration','Expiration','date','Dates'],['dRenewalNotice','Renewal notice','date','Dates'],['dRenewalDue','Renewal due','date','Dates'],['dInspRequested','Inspection requested','date','Dates'],['dInspection','Inspection','date','Dates'],['dSignoff','Sign-off','date','Dates'],['dTarget','Target completion','date','Dates'],['dActual','Actual completion','date','Dates'],
 ['currentStatus','Current status','status','Status & responsibility',1],['priority','Priority','list:Priority','Status & responsibility'],['bicCategory','Ball-in-court category','list:Ball-in-Court Category','Status & responsibility',1],['bicCompany','Ball-in-court company','company','Status & responsibility'],['bicPerson','Ball-in-court individual','contact','Status & responsibility'],['respCompany','Responsible company','company','Status & responsibility'],['respPerson','Responsible individual','contact','Status & responsibility'],['actionOwner','Action owner','contact','Status & responsibility'],['reviewer','Agency reviewer','text','Status & responsibility'],['nextAction','Next required action','text','Status & responsibility',1],
 ['trInitial','Initial received','date','Special inspections (TR)'],['trFinal','Final received','date','Special inspections (TR)'],
 ['paymentStatus','Payment status','list:Payment Status','Money & documents'],['docLink','Document link','url','Money & documents'],['folder','Project folder','url','Money & documents'],
 ['comments','Comments','textarea','Notes'],['issues','Outstanding issues','textarea','Notes']];
const FD = Object.fromEntries(FIELDS.map(f=>[f[0],{key:f[0],label:f[1],type:f[2],group:f[3],core:!!f[4]}]));
const GROUPS = ['Identity','Reference numbers','Dates','Status & responsibility','Special inspections (TR)','Money & documents','Notes'];
const PAIRS = {bicCompany:'bicPerson',respCompany:'respPerson'};
const STAGE_FIELDS = {filing:['dInitialFiling'],planExam:['dSubmission'],objections:['dResubmission'],approval:['dApproval'],issuance:['dIssue'],payment:['paymentStatus'],inspection:['dInspRequested','dInspection'],testing:[],signoff:['dSignoff'],renewal:['dRenewalNotice','dRenewalDue'],expires:['dEffective','dExpiration']};
const STAGE_LABEL = {filing:'Initial filing required',planExam:'Plan examination / review',objections:'Objections / comments cycle',approval:'Approval before issuance',issuance:'Issuance step',payment:'Payment / fees required',inspection:'Inspection(s) required',testing:'Testing required',signoff:'Final sign-off / CO required',renewal:'Renewal required',expires:'Expires (has a validity period)'};
const STAGES = ['Filing','Plan exam','Objections','Approval','Issuance','Inspections','Sign-off'];
const FINAL_IN_STAGE = ['Approved','Issued','Inspection Passed','Signed Off'];
const CLOSED = ['Closed','Signed Off','Cancelled','Superseded','Not Applicable'];
const PREFIX = {'DOB':'DOB','DOT':'DOT','DEP':'DEP','FDNY':'FDNY','DOHMH':'DOHMH','Parks':'PARKS','Landmarks':'LPC','MTA':'MTA','Utilities':'UTIL','TR (Special Inspections)':'TR','Other Agencies':'OTHER'};
const CHECKS = [
 ['dupOfficial','Duplicate official agency ID'],['dupCode','Duplicate record code in a project'],['issuedNoDate','Issued with no issue date'],['issuedNoId','Issued with no official agency ID'],['issueAfterExp','Issue date after expiration'],['renewAfterExp','Renewal due after expiration'],['archivedNoClose','Archived with no completion or explanation'],['noName','No name'],['noStatus','No current status'],['noBic','Nobody is ball-in-court'],['bicMismatch','Ball-in-court person is not at that company']];
const CHECK_LABEL = Object.fromEntries(CHECKS);
const DEADLINES = [['due7','Due within 7 days'],['overdue','Overdue'],['exp60','Expiring within 60 days'],['ren30','Renewal due within 30 days'],['stale','Not touched in 30+ days']];
const VOCAB_INFO = {
 'Agency':['Records','The desks a filing goes to. Every permit type is tagged to one.'],
 'Permit Category':['Records','The groups the catalog is browsed by, and the one list scoped per agency.'],
 'Ball-in-Court Category':['Records','Who the next move belongs to.'],
 'Priority':['Records','How urgent a record is.'],
 'Payment Status':['Records','Where a fee stands.'],
 'Reference Number Type':['Records','The kinds of number a permit type carries.'],
 'Dependency Type':['Records','How one item blocks another.'],
 'Project Type':['Projects','The kinds of job a permit type applies to.'],
 'Borough':['Projects','Where a project is.'],
 'Company Type':['Directory','What kind of firm a directory company is.'],
 'Discipline':['Directory','The trades. Used by companies, contacts, the project team and the catalog.'],
 'Project Role':['Directory','How a person or firm is described on a job.'],
 'Inspection Result':['Inspections','How an inspection went.'],
 'Inspection Performed By':['Inspections','Who carries out an inspection.'],
 'Capitalization Exception':['Text & formatting','All-caps words smart capitalization leaves alone.']};
const STAGE_OPTS = ['none','Filing','Plan exam','Objections','Approval','Issuance','Inspections','Sign-off','Renewal','Expiry','done'];

// ---------- helpers ----------
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = ()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const dayN = d=>Math.round(Date.parse(d+'T12:00:00Z')/864e5);
const daysUntil = d=>d? dayN(d)-dayN(today()) : null;
const fmtD = d=>{ if(!d) return '—'; const t=new Date(d.length===10?d+'T12:00:00Z':d); return t.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric',timeZone: d.length===10?'UTC':'America/New_York'}); };
const fmtDT = d=>d? new Date(d).toLocaleString('en-US',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}) : '';
const uidGen = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const opts = (list,sel,blank='—')=>(blank!==null?`<option value="">${esc(blank)}</option>`:'')+list.map(v=>{const [val,lab]=Array.isArray(v)?v:[v,v];return `<option value="${esc(val)}"${val===sel?' selected':''}>${esc(lab)}</option>`}).join('');
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600);}
function smartCap(s){ if(!s) return s; const ex=new Set((S.cfg?.lists['Capitalization Exception']||[]).map(x=>x.toUpperCase()));
  return s.replace(/[A-Za-z][A-Za-z']*/g,(w,pos)=>{const u=w.toUpperCase(); if(ex.has(u)) return u; if(w!==w.toLowerCase()) return w; if(/^mc[a-z]/.test(w)) return 'Mc'+w[2].toUpperCase()+w.slice(3); if(/^o'[a-z]/.test(w)) return "O'"+w[2].toUpperCase()+w.slice(3); if(pos>0&&/^(of|and|the|at|on|in|for|to)$/.test(w)) return w; return w[0].toUpperCase()+w.slice(1);}); }

// ---------- state ----------
const S = {cfg:null,catalog:{},projects:{},records:{},companies:{},contacts:{},ready:{},me:{},names:{},
  view:'dashboard', recId:null, projId:null, typeId:null, newProject:false, sel:null,
  F:{project:[],agency:[],category:[],status:[],bic:[],priority:[],show:['Active'],check:'',deadline:''},
  sort:{col:'dTarget',dir:1}, cols:null, groupAgency:false, dirty:false, pending:false, recTab:'details',
  report:'status', rp:{project:'',agency:'',status:'',group:'',show:'Active',from:'',to:''}, setTab:'vocab', vocab:'Agency',
  catF:{agency:'',category:'',template:'',q:'',retired:false}, slateSel:new Set(), slateF:{agency:'',category:'',q:''},
  dirQ:'', dirInactive:false, openRow:null, email:null, noDb:false, offline:false};
let db=null,user=null,uid=null,canWrite=true,canEditCfg=false,downloads=null;
const COLS_DEFAULT=['name','agency','category','currentStatus','bic','nextAction','priority','dTarget','updated'];
try{const c=JSON.parse(localStorage.getItem('pd.cols2')||'null'); if(Array.isArray(c)) S.cols=c;}catch(e){}
if(!S.cols) S.cols=COLS_DEFAULT.slice();
const COLW_DEFAULT={name:260,nextAction:240,description:260,comments:260,issues:240,project:170,code:100,agency:110,category:150,currentStatus:160,bic:170,priority:100,updated:130};
S.colW={}; S.lay={}; try{S.colW=JSON.parse(localStorage.getItem('pd.colw')||'{}')||{}; S.lay=JSON.parse(localStorage.getItem('pd.lay')||'{}')||{};}catch(e){}
const colWidth=c=>S.colW[c]||COLW_DEFAULT[c]||(String(c).startsWith('d')?125:140);

// lookups
const lists = n=>(S.cfg?.lists?.[n]||[]).filter(v=>!(S.cfg.retired?.[n]||[]).includes(v));
const statuses = ()=>(S.cfg?.statuses||[]).filter(s=>!s[2]).map(s=>s[0]);
const stageOf = st=>(S.cfg?.statuses||[]).find(s=>s[0]===st)?.[1]||'none';
const coName = id=>S.companies[id]?.name||'';
const ctName = id=>S.contacts[id]?.name||'';
const projName = id=>S.projects[id]?.name||'';
const activeCos = ()=>Object.entries(S.companies).filter(([,c])=>c.active!==false).sort((a,b)=>a[1].name.localeCompare(b[1].name));
const activeCts = ()=>Object.entries(S.contacts).filter(([,c])=>c.active!==false).sort((a,b)=>a[1].name.localeCompare(b[1].name));
const recs = ()=>Object.entries(S.records).map(([id,r])=>({...r,id}));
const bicLabel = r=>r.bicPerson?ctName(r.bicPerson):r.bicCompany?coName(r.bicCompany):(r.bicCategory||'');
function catScopeOK(cat,agency){const sc=S.cfg?.scope?.[cat]; return !sc||!agency||sc.includes(agency);}

// ---------- computed ----------
function checksFor(r, all){
  const out=[];
  if(r.officialId && all.some(o=>o.id!==r.id && o.officialId && o.officialId.trim()===r.officialId.trim())) out.push('dupOfficial');
  if(r.code && all.some(o=>o.id!==r.id && o.projectId===r.projectId && o.code===r.code)) out.push('dupCode');
  if(r.currentStatus==='Issued' && !r.dIssue) out.push('issuedNoDate');
  if(r.currentStatus==='Issued' && !r.officialId) out.push('issuedNoId');
  if(r.dIssue && r.dExpiration && r.dIssue>r.dExpiration) out.push('issueAfterExp');
  if(r.dRenewalDue && r.dExpiration && r.dRenewalDue>r.dExpiration) out.push('renewAfterExp');
  if(r.recordStatus==='Archived' && !r.dActual && !(r.comments||'').trim()) out.push('archivedNoClose');
  if(!(r.name||'').trim()) out.push('noName');
  if(!r.currentStatus) out.push('noStatus');
  if(!r.bicCategory && !r.bicCompany && !r.bicPerson) out.push('noBic');
  if(r.bicPerson && r.bicCompany && S.contacts[r.bicPerson] && S.contacts[r.bicPerson].companyId!==r.bicCompany) out.push('bicMismatch');
  return out;
}
function deadlinesFor(r){
  const out=[]; if(r.recordStatus!=='Active' || CLOSED.includes(r.currentStatus)) return out;
  const t=daysUntil(r.dTarget); if(t!==null && !r.dActual){ if(t<0) out.push(['overdue',r.dTarget,t]); else if(t<=7) out.push(['due7',r.dTarget,t]); }
  if(r.setup?.expires!==false){ const e=daysUntil(r.dExpiration); if(e!==null && e>=0 && e<=60) out.push(['exp60',r.dExpiration,e]); }
  if(r.setup?.renewal!==false){ const n=daysUntil(r.dRenewalDue); if(n!==null && n>=0 && n<=30) out.push(['ren30',r.dRenewalDue,n]); }
  if(r.updatedAt && (Date.now()-Date.parse(r.updatedAt))/864e5>=30) out.push(['stale',r.updatedAt.slice(0,10),null]);
  return out;
}
let CMP=null;
function computed(){
  if(CMP) return CMP;
  const all=recs(); const map={};
  all.forEach(r=>{ map[r.id]={checks:checksFor(r,all),dl:deadlinesFor(r)}; });
  return CMP={all,map};
}
function progress(r){
  const st=stageOf(r.currentStatus);
  if(st==='done') return {done:7,cur:-1,label:'Complete'};
  const i=STAGES.indexOf(st);
  if(i<0) return {done:0,cur:-1,label:st==='Renewal'||st==='Expiry'?st:'Not yet started'};
  const done=i+(FINAL_IN_STAGE.includes(r.currentStatus)?1:0);
  return {done,cur:done<7?done:-1,label:r.currentStatus};
}
function trStatus(pid){
  const trs=recs().filter(r=>r.projectId===pid && r.agency==='TR (Special Inspections)' && r.recordStatus!=='Archived');
  if(!trs.length) return {n:0,label:'No TRs on this job',ok:null};
  const done=trs.filter(r=>r.trFinal || ['Signed Off','Closed'].includes(r.currentStatus)).length;
  return {n:trs.length,done,ok:done===trs.length,label:done===trs.length?`All ${trs.length} TRs signed off`:`${done} of ${trs.length} TRs have a Final`};
}
function myAlerts(){
  const cid=S.me.contactId; if(!cid) return null;
  const {all,map}=computed(); const out=[];
  all.forEach(r=>{ if(r.bicPerson===cid||r.respPerson===cid||r.actionOwner===cid){ map[r.id].dl.forEach(d=>{ if((S.me.alertTypes||DEADLINES.map(x=>x[0])).includes(d[0])) out.push({r,d}); }); }});
  return out.sort((a,b)=>(a.d[1]||'').localeCompare(b.d[1]||''));
}

// ---------- filtering ----------
function filtered(F=S.F){
  const {all,map}=computed();
  return all.filter(r=>{
    if(F.project.length && !F.project.includes(r.projectId)) return false;
    if(F.agency.length && !F.agency.includes(r.agency)) return false;
    if(F.category.length && !F.category.includes(r.category)) return false;
    if(F.status.length && !F.status.includes(r.currentStatus)) return false;
    if(F.priority.length && !F.priority.includes(r.priority)) return false;
    if(F.bic.length && !F.bic.includes(r.bicCategory)) return false;
    if(F.show.length && !F.show.includes(r.recordStatus||'Queued')) return false;
    if(F.check==='any' && !map[r.id].checks.length) return false;
    if(F.check && F.check!=='any' && !map[r.id].checks.includes(F.check)) return false;
    if(F.deadline && !map[r.id].dl.some(d=>d[0]===F.deadline)) return false;
    if(F.bicCompany && r.bicCompany!==F.bicCompany) return false;
    if(F.bicPerson && r.bicPerson!==F.bicPerson) return false;
    return true;
  });
}
function goRecords(patch){ S.F={project:[],agency:[],category:[],status:[],bic:[],priority:[],show:['Active'],check:'',deadline:'',...patch}; S.sel=null; nav('records'); }


// ---------- style switch (Original / Modern / Classic, light / dark) ----------
document.addEventListener('click',e=>{
  if(e.target.closest('#modeBtn')){ const d=document.documentElement; const m=d.dataset.mode==='dark'?'light':'dark'; d.dataset.mode=m; d.dataset.theme=m; try{localStorage.setItem('pd.mode',m);}catch(_){} renderTop(); }
});
document.addEventListener('change',e=>{ if(e.target.id!=='kitSel') return; const v=e.target.value, d=document.documentElement;
  if(v==='original') d.removeAttribute('data-kit'); else d.dataset.kit=v; try{localStorage.setItem('pd.kit2',v);}catch(_){} renderTop(); });

// ---------- db ----------
async function boot(){
  renderNav(); render();
  if(!window.claude?.use){ S.noDb=true; render(); return; }

const SET_TAB0=S.setTab;
function pageHash(){ const v=S.view; let id='';
  if(v==='records'&&S.recId) id=S.recId;
  else if(v==='projects') id=S.newProject?'new':(S.projId||'');
  else if(v==='catalog'&&S.typeId) id=S.typeId==='__new'?'new':S.typeId;
  else if(v==='admin'&&S.setTab&&S.setTab!==SET_TAB0) id=S.setTab;
  return '#'+v+(id?'/'+encodeURIComponent(id):''); }
let histReady=false;
function syncHistory(){ const h=pageHash(); const url=location.pathname+location.search+h;
  if(!histReady){ histReady=true; if(location.hash!==h) history.replaceState(null,'',url); return; }
  if(location.hash!==h) history.pushState(null,'',url); }
function applyHash(){ const [v,raw]=location.hash.slice(1).split('/'); if(!VIEWS.some(x=>x[0]===v)) return false;
  const id=raw?decodeURIComponent(raw):'';
  const st={view:v,recId:null,projId:null,typeId:null,newProject:false,email:null};
  if(v==='records'&&id){ st.recId=id; st.recTab='details'; }
  if(v==='projects'&&id){ if(id==='new') st.newProject=true; else st.projId=id; }
  if(v==='catalog'&&id) st.typeId=id==='new'?'__new':id;
  if(v==='admin') st.setTab=id||SET_TAB0;
  Object.assign(S,st); return true; }
window.addEventListener('popstate',()=>{

  const bc=grp('bicCategory'), bco=grp('bicCompany'), bp=grp('bicPerson');
  const projects=Object.entries(S.projects).filter(([,p])=>p.status!=='Archived').sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const listTbl=(o,lab,fmt,mk)=>Object.keys(o).length?`<table><tbody>${Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr class="click" data-go='${esc(JSON.stringify({...base,...mk(k)}))}'><td>${esc(fmt(k))}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table>`:`<p class="empty">${lab}</p>`;

  const objLate=obj.filter(r=>(ageOf(r)||0)>90);
  const durs=live.map(r=>{const a=r.dSubmission||r.dInitialFiling, b=r.dApproval||r.dIssue; return a&&b?(Date.parse(b)-Date.parse(a))/864e5:null;}).filter(x=>x!=null&&x>=0).sort((a,b)=>a-b);
  const med=durs.length?Math.round(durs.length%2?durs[(durs.length-1)/2]:(durs[durs.length/2-1]+durs[durs.length/2])/2):null;

const BORO_CODE={Manhattan:'1',Bronx:'2',Brooklyn:'3',Queens:'4','Staten Island':'5'};
const BORO_NAME={1:'Manhattan',2:'Bronx',3:'Brooklyn',4:'Queens',5:'Staten Island'};
const NYC_DS='https://data.cityofnewyork.us/resource/';
async function soda(ds,params){ const u=new URL(NYC_DS+ds+'.json'); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v)); const r=await fetch(u); if(!r.ok) throw new Error(ds+' '+r.status); return r.json(); }
const sq=v=>String(v).replace(/'/g,"''");
const nz=v=>String(v??'').replace(/^0+(?=\d)/,'').trim();
async function pullNyc(pid){
  const p=S.projects[pid]; if(!p) return;
  let bin=(p.bin||'').trim(), boro=p.borough||'', block=nz(p.block), lot=nz(p.lot);
  if(!bin && !(boro&&block&&lot)) { toast('Enter a BIN, or the borough with block and lot.'); return; }
  S.nycBusy=pid; render(); toast('Pulling NYC data…');
  try{
    const where=bin?`bin='${sq(bin)}'`:`upper(borough)='${sq(boro.toUpperCase())}' AND block='${sq(block)}' AND lot='${sq(lot)}'`;
    const fil=await soda('w9ak-ipjd',{'$where':where,'$order':'filing_date DESC','$limit':'300'});
    if(fil[0]){ bin=bin||fil[0].bin||''; block=block||nz(fil[0].block); lot=lot||nz(fil[0].lot); boro=boro||(fil[0].borough? fil[0].borough.replace(/\b\w/g,c=>c.toUpperCase()).replace(/\B\w/g,c=>c.toLowerCase()):''); }
    const bc=BORO_CODE[boro]; const bbl=(fil[0]?.bbl)||(bc&&block&&lot?bc+block.padStart(5,'0')+lot.padStart(4,'0'):'');
    const [pl,per,ecbOpen,ecbAll,dobv]=await Promise.all([
      bbl?soda('64uk-42ks',{bbl,'$limit':'1'}).catch(()=>[]):[],
      bin?soda('rbx6-tga4',{bin,'$order':'issued_date DESC','$limit':'300'}).catch(()=>[]):[],
      bin?soda('6bgk-3dad',{'$where':`bin='${sq(bin)}' AND ecb_violation_status!='RESOLVE'`,'$order':'issue_date DESC','$limit':'50'}).catch(()=>[]):[],
      bin?soda('6bgk-3dad',{'$select':'count(*) as n','$where':`bin='${sq(bin)}'`}).catch(()=>[]):[],
      bin?soda('3h2n-5cm9',{'$select':'count(*) as n','$where':`bin='${sq(bin)}' AND violation_category like '%ACTIVE%'`}).catch(()=>[]):[],
    ]);
    const L=pl[0]||{};
    const nyc={pulledAt:new Date().toISOString(),bin,bbl,
      building:pl[0]?{address:L.address||'',owner:L.ownername||'',floors:L.numfloors?String(Math.round(+L.numfloors)):'',yearBuilt:L.yearbuilt||'',zoning:[L.zonedist1,L.spdist1].filter(Boolean).join(' / '),bldgClass:L.bldgclass||'',bldgArea:L.bldgarea||'',units:L.unitstotal||'',landmark:L.landmark||'',histdist:L.histdist||''}:null,
      filings:fil.map(f=>({n:f.job_filing_number,st:f.filing_status||'',type:f.job_type||'',work:Object.keys(f).filter(k=>/work_type_?$/.test(k)&&/^yes$/i.test(f[k])).map(k=>k.replace(/_work_type_?$/,'').replace(/_/g,' ')).join(', ')||f.specialinspectionrequirement||'',filed:(f.filing_date||'').slice(0,10),status:(f.current_status_date||'').slice(0,10),applicant:[f.applicant_first_name,f.applicant_last_name].filter(Boolean).join(' '),cost:f.initial_cost||''})),
      permits:per.map(x=>({n:x.work_permit||x.job_filing_number,job:x.job_filing_number,type:x.work_type||'',reason:x.filing_reason||'',issued:(x.issued_date||'').slice(0,10),expires:(x.expired_date||'').slice(0,10),by:x.applicant_business_name||''})),
      ecb:{open:ecbOpen.length,total:+(ecbAll[0]?.n||0),list:ecbOpen.slice(0,10).map(v=>({n:v.ecb_violation_number,type:v.violation_type||'',issued:v.issue_date||'',due:v.balance_due||'',desc:(v.violation_description||'').slice(0,140)}))},
      dobOpen:+(dobv[0]?.n||0)};
    const patch={nyc,...stamp()};
    if(!p.bin&&bin) patch.bin=bin; if(!p.block&&block) patch.block=block; if(!p.lot&&lot) patch.lot=lot; if(!p.borough&&boro&&BORO_CODE[boro]) patch.borough=boro;
    if(!p.address&&nyc.building?.address) patch.address=nyc.building.address.replace(/\b\w+/g,w=>w[0]+w.slice(1).toLowerCase());
    S.nycBusy=null;
    if(await put('projects',pid,patch,true)) toast(`Pulled ${nyc.filings.length} filings, ${nyc.permits.length} permits${nyc.building?', building info':''}.`);
    else render();
  }catch(e){ S.nycBusy=null; render(); toast('NYC Open Data did not answer. Try again in a minute.'); console.error(e); }
}

  const types=Object.values(S.catalog).filter(t=>t.active!==false&&(!sf.agency||t.agency===sf.agency)&&(!sf.category||t.category===sf.category)&&(!q||(t.name+' '+t.code+' '+(t.description||'')).toLowerCase().includes(q)));

   ${team.length?`<table><tbody>${team.map((m,i)=>`<tr><td><b>${esc(m.discipline)}</b></td><td>${esc(coName(m.companyId))}${m.contactId?' · '+esc(ctName(m.contactId)):''}</td><td>${esc(m.role||'')}</td><td>${m.isDefault?'<span class="pill a">Default</span>':''}</td><td>${dis?'':`<button class="btn link" data-act="teamDel" data-i="${i}">Remove</button>`}</td></tr>`).join('')}</tbody></table>`:`<p class="note info">No team yet. Add at least the architect and the expediter; those are the two the catalog reaches for most.</p>`}
   ${dis?'':`<div class="fields"><label class="f">Discipline<select id="tmDisc">${opts(lists('Discipline'),'','Pick…')}</select></label><label class="f">Company<select id="tmCo">${opts(activeCos().map(([i,c])=>[i,c.name]),'')}</select></label><label class="f">Person<select id="tmCt">${opts(activeCts().map(([i,c])=>[i,c.name+' · '+coName(c.companyId)]),'')}</select></label><label class="f">Role label<select id="tmRole">${opts(lists('Project Role'),'')}</select></label><label class="chk" style="align-self:end"><input type="checkbox" id="tmDef" checked> Default for this discipline</label><div style="align-self:end"><button class="btn" data-act="teamAdd">Add</button></div></div>`}</div></section>
  ${dis?'':`<section class="sec"><header><h3>Build the slate · ${S.slateSel.size} selected</h3><small style="color:var(--muted)">Narrow the catalog, then check off everything this job needs in one pass. Selected types land as Queued, Not Started records.</small></header><div class="bd stack">
   <div class="row"><label class="f" style="width:180px">Agency<select id="slAg" data-sf="agency">${opts(lists('Agency'),sf.agency,'All')}</select></label><label class="f" style="width:200px">Category<select id="slCat" data-sf="category">${opts(lists('Permit Category').filter(c=>catScopeOK(c,sf.agency)),sf.category,'All')}</select></label><label class="f" style="width:150px">Group by<select id="slGrp" data-sf="group">${opts([['agency','Agency'],['category','Category'],['discipline','Discipline']],groupBy,null)}</select></label><label class="f" style="flex:1;min-width:180px">Search<input id="slQ" type="search" data-sf="q" value="${esc(sf.q)}" placeholder="Name, code or description"></label></div>
   <div class="row" style="font-size:12.5px;color:var(--muted)">${types.length} of ${Object.keys(S.catalog).length} types · ${Object.entries(counts).map(([a,n])=>`${esc(a)} ${n}`).join(' · ')}</div>
   <div class="picker">${Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,ts])=>`<div class="grp">${esc(k)} · ${ts.length}</div>`+ts.sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name)).map(t=>`<label><input type="checkbox" data-slate="${esc(t.code)}"${S.slateSel.has(t.code)?' checked':''}><span class="code">${esc(t.code)}</span><span>${esc(t.name)}<small>${esc(t.description||t.category)}</small></span><span class="row" style="gap:4px">${onSlate[t.code]?`<span class="pill a">On slate${onSlate[t.code]>1?' ('+onSlate[t.code]+')':''}</span>`:''}<span class="pill ${t.review==='reviewed'?'good':'acc'}">${t.review==='reviewed'?'Reviewed':'Auto'}</span></span></label>`).join('')).join('')||'<p class="empty">No types match.</p>'}</div>
   <div class="row"><button class="btn pri" data-act="slateAdd"${S.slateSel.size?'':' disabled'}>Add ${S.slateSel.size||''} to the slate</button>${S.slateSel.size?`<button class="btn" data-act="slateClear">Clear selection</button>`:''}</div></div></section>`}
  <section class="sec"><header><h3>The slate</h3><small style="color:var(--muted)">${rs.length} items · ${rs.filter(r=>r.currentStatus==='Not Started').length} not started · ${rs.filter(r=>r.recordStatus==='Active').length} active. Starting an item moves it out of Not Started.</small></header><div class="bd">

  <section class="sec"><header><h3>Building department requirements</h3></header><div class="bd row" style="justify-content:space-between"><span><span class="pill">DOB</span> All TRs signed off <span class="pill">Computed</span></span><span class="pill ${tr.ok===true?'good':tr.ok===false?'warn':''}">${tr.label}</span></div><div class="bd" style="padding-top:0"><small style="color:var(--muted)">DOB won't close a job until its special inspections are complete. This reads the TR items on the slate every time the page loads; it turns satisfied when every TR has a Final received.</small></div></section>
  ${dis?'':`<section class="sec"><header><h3>Add a document line item</h3><small style="color:var(--muted)">A survey, an asbestos report, a stamped set: anything the job must produce gets its own line and can be a prerequisite for a permit.</small></header><div class="bd fields"><label class="f">Name<input id="dlName" type="text"></label><label class="f">Agency (optional)<select id="dlAg">${opts(lists('Agency'),'')}</select></label><label class="f">Category<select id="dlCat">${opts(lists('Permit Category'),'')}</select></label><div style="align-self:end"><button class="btn" data-act="docAdd">Add document</button></div></div></section>`}
  <details class="sec"><summary style="padding:10px 14px;cursor:pointer"><b>Project details</b></summary><form id="projEdit" data-form="projEdit" class="bd fields"><label class="f">Project name<input id="pe_name" type="text" data-p="name" value="${esc(p.name)}" data-cap="1"${dis?' disabled':''}></label><label class="f">Address<input id="pe_addr" type="text" data-p="address" value="${esc(p.address)}" data-cap="1"${dis?' disabled':''}></label><label class="f">Borough<select id="pe_bor" data-p="borough"${dis?' disabled':''}>${opts(lists('Borough'),p.borough)}</select></label><label class="f">BIN<input id="pe_bin" type="text" inputmode="numeric" data-p="bin" value="${esc(p.bin||'')}"${dis?' disabled':''}></label><label class="f">Block<input id="pe_block" type="text" inputmode="numeric" data-p="block" value="${esc(p.block||'')}"${dis?' disabled':''}></label><label class="f">Lot<input id="pe_lot" type="text" inputmode="numeric" data-p="lot" value="${esc(p.lot||'')}"${dis?' disabled':''}></label><label class="f">Project type<select id="pe_type" data-p="type"${dis?' disabled':''}>${opts(lists('Project Type'),p.type)}</select></label><label class="f">Status<select id="pe_st" data-p="status"${dis?' disabled':''}>${opts(['Active','Archived'],p.status||'Active',null)}</select></label>${personFields(p)}<label class="f wide">Notes<textarea id="pe_notes" data-p="notes"${dis?' disabled':''}>${esc(p.notes)}</textarea></label>${dis?'':'<div><button class="btn pri" type="submit">Save project</button></div>'}</form></details>
  </div>`;

// ---------- catalog ----------
function vCatalog(){
  if(S.typeId) return vType();
  const F=S.catF; const q=F.q.toLowerCase(); const all=Object.values(S.catalog);
  const n={reviewed:0,auto:0,unreviewed:0}; all.forEach(t=>n[t.review||'unreviewed']++);
  const rows=all.filter(t=>(F.retired||t.active!==false)&&(!F.agency||t.agency===F.agency)&&(!F.category||t.category===F.category)&&(!F.template||t.review===F.template)&&(!q||(t.code+' '+t.name+' '+(t.description||'')).toLowerCase().includes(q))).sort((a,b)=>(F.group?a.agency.localeCompare(b.agency):0)||a.code.localeCompare(b.code,undefined,{numeric:true}));
  const pct=k=>all.length?n[k]/all.length*100:0;
  let lastAg=null;
  return `<div class="row" style="justify-content:space-between"><div><h1>Master catalog</h1><p class="lede">Author a permit type once: its agency, its fields, its defaults. Every record created from it inherits the lot.</p></div>${canWrite?`<button class="btn pri" data-act="typeNew">Add a permit type</button>`:''}</div>
  <div class="card stack" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${n.reviewed} reviewed · ${n.auto} auto · ${n.unreviewed} unreviewed of ${all.length}</b><small style="color:var(--muted)">Auto types carry a starter template that a person hasn't confirmed yet.</small></div><div class="bar"><span style="width:${pct('reviewed')}%;background:var(--good)"></span><span style="width:${pct('auto')}%;background:var(--accent)"></span><span style="width:${pct('unreviewed')}%;background:var(--line-strong)"></span></div></div>
  <div class="row" style="margin-bottom:10px"><label class="f" style="width:170px">Agency<select id="cfAg" data-cf="agency">${opts(lists('Agency'),F.agency,'All')}</select></label><label class="f" style="width:190px">Category<select id="cfCat" data-cf="category">${opts(lists('Permit Category'),F.category,'All')}</select></label><label class="f" style="width:140px">Template<select id="cfT" data-cf="template">${opts([['unreviewed','Unreviewed'],['auto','Auto'],['reviewed','Reviewed']],F.template,'All')}</select></label><label class="f" style="flex:1;min-width:180px">Search<input id="cfQ" type="search" data-cf="q" value="${esc(F.q)}" placeholder="Name, code or description"></label><label class="chk" style="align-self:end"><input type="checkbox" id="cfR" data-cf="retired"${F.retired?' checked':''}> Show retired</label><button class="btn" style="align-self:end" data-act="catGroup">${F.group?'Ungroup':'Group by agency'}</button></div>
  <p style="color:var(--muted);margin:0 0 8px">Showing ${rows.length} of ${all.length}.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Agency</th><th>Category</th><th class="num">Fields</th><th>Template</th></tr></thead><tbody>${rows.map(t=>{let pre='';if(F.group&&t.agency!==lastAg){lastAg=t.agency;pre=`<tr><td colspan="6" style="background:var(--sunk);font-weight:600">${esc(t.agency)}</td></tr>`;}return pre+`<tr class="click" data-type="${esc(t.code)}"><td><span class="code">${esc(t.code)}</span></td><td>${esc(t.name)}${t.active===false?' <span class="pill">Retired</span>':''}</td><td>${esc(t.agency)}</td><td>${esc(t.category)}</td><td class="num">${(t.fields||[]).length}</td><td><span class="pill ${t.review==='reviewed'?'good':t.review==='auto'?'acc':''}">${t.review==='reviewed'?'Reviewed':t.review==='auto'?'Auto':'Unreviewed'}</span></td></tr>`}).join('')}</tbody></table></div>`;
}
function vType(){
  const isNew=S.typeId==='__new'; const t=isNew?(S.typeDraft||{code:'',name:'',agency:'',category:'',fields:FIELDS.filter(f=>f[4]).map(f=>f[0]),review:'unreviewed',active:true,disciplines:[],projectTypes:[],inspectionTypes:[]}):S.catalog[S.typeId];
  if(!t) return `<p class="empty">Type not found.</p>`;
  const dis=!canWrite; const fs=new Set(t.fields||[]); const used=recs().filter(r=>r.catalogCode===t.code).length;
  const stageOn=k=>STAGE_FIELDS[k].length?STAGE_FIELDS[k].every(f=>fs.has(f)):!!(t.testing);
  const expOn=fs.has('dExpiration');
  return `<button class="btn link" data-act="typeBack">← Master catalog</button>
  <div class="row"><span class="code" style="font-size:14px">${esc(t.code||'New')}</span><h1 style="margin:0">${esc(t.name||'New permit type')}</h1><span class="pill ${t.review==='reviewed'?'good':t.review==='auto'?'acc':''}">${t.review==='reviewed'?'Reviewed':t.review==='auto'?'Auto':'Unreviewed'}</span></div>
  <p class="lede">${esc(t.agency)} · ${esc(t.category)} · ${used} records inherit this template</p>
  ${t.review==='auto'?`<p class="note" style="margin-bottom:12px">A starter template was applied automatically. Open it, adjust what is off, and mark it reviewed when you save.</p>`:''}
  <form id="typeForm" data-form="type" class="stack" autocomplete="off">
  <section class="sec"><header><h3>Identity & classification</h3></header><div class="bd fields">
   <label class="f">Name<input id="ty_name" type="text" data-t="name" value="${esc(t.name)}" required${dis?' disabled':''}></label><label class="f">Catalog code<input id="ty_code" type="text" data-t="code" value="${esc(t.code)}" placeholder="auto"${isNew&&!dis?'':' disabled'}></label>
   <label class="f">Agency<select id="ty_ag" data-t="agency"${dis?' disabled':''}>${opts(lists('Agency'),t.agency)}</select></label><label class="f">Permit category<select id="ty_cat" data-t="category"${dis?' disabled':''}>${opts(lists('Permit Category').filter(c=>catScopeOK(c,t.agency)||c===t.category),t.category)}</select></label>
   <label class="f">Agency bureau / unit<input id="ty_bur" type="text" data-t="bureau" value="${esc(t.bureau)}"${dis?' disabled':''}></label><label class="f">Typical trigger / when required<input id="ty_trig" type="text" data-t="trigger" value="${esc(t.trigger)}"${dis?' disabled':''}></label>
   <label class="f wide">Description / scope<textarea id="ty_desc" data-t="description"${dis?' disabled':''}>${esc(t.description)}</textarea></label>
   <div class="wide"><div class="flab">Disciplines</div><div class="row">${lists('Discipline').map(d=>`<label class="chk"><input type="checkbox" data-tdisc="${esc(d)}"${(t.disciplines||[]).includes(d)?' checked':''}${dis?' disabled':''}> ${esc(d)}</label>`).join('')}</div></div>
   <div class="wide"><div class="flab">Applicable project types</div><div class="row">${lists('Project Type').map(d=>`<label class="chk"><input type="checkbox" data-tpt="${esc(d)}"${(t.projectTypes||[]).includes(d)?' checked':''}${dis?' disabled':''}> ${esc(d)}</label>`).join('')}</div></div></div></section>
  <section class="sec"><header><h3>Lifecycle stages</h3><small style="color:var(--muted)">Shortcuts: each ticks or unticks its field group below. The field list is what governs the record.</small></header><div class="bd row" style="gap:14px">${Object.keys(STAGE_FIELDS).map(k=>`<label class="chk"><input type="checkbox" data-stage="${k}"${stageOn(k)?' checked':''}${dis||(k==='renewal'&&!expOn)?' disabled':''}> ${STAGE_LABEL[k]} <small style="color:var(--muted)">${k==='renewal'?'only while expiry is on · ':''}${STAGE_FIELDS[k].length?STAGE_FIELDS[k].length+' field'+(STAGE_FIELDS[k].length>1?'s':''):''}</small></label>`).join('')}</div></section>
  <section class="sec"><header><h3>Field set · ${fs.size} of 45 fields</h3><small style="color:var(--muted)">Core fields are always on. A person always brings their company.</small></header><div class="bd stack">${GROUPS.map(g=>`<div><div class="flab">${g}</div><div class="row" style="gap:12px">${FIELDS.filter(f=>f[3]===g).filter(f=>!(['dRenewalNotice','dRenewalDue'].includes(f[0])&&!expOn)).map(f=>`<label class="chk"><input type="checkbox" data-tf="${f[0]}"${fs.has(f[0])||f[4]?' checked':''}${f[4]||dis?' disabled':''}> ${f[1]}${f[4]?' <span class="pill">Core</span>':''}</label>`).join('')}</div></div>`).join('')}</div></section>
  <section class="sec"><header><h3>Responsibility, fees & timing</h3></header><div class="bd fields">
   <label class="f">Typical responsible discipline / role<input id="ty_role" type="text" data-t="typicalRole" value="${esc(t.typicalRole)}" placeholder="e.g. Architect of Record"${dis?' disabled':''}></label><label class="f">Typical starting ball-in-court<select id="ty_bic" data-t="typicalBic"${dis?' disabled':''}>${opts(lists('Ball-in-Court Category'),t.typicalBic)}</select></label>
   <label class="f">Fee basis<input id="ty_fb" type="text" data-t="feeBasis" value="${esc(t.feeBasis)}"${dis?' disabled':''}></label><label class="f">Typical fee ($)<input id="ty_fee" type="number" data-t="typicalFee" value="${esc(t.typicalFee)}"${dis?' disabled':''}></label>
   <label class="f">Lead time (days)<input id="ty_lead" type="number" data-t="leadDays" value="${esc(t.leadDays)}"${dis?' disabled':''}></label><label class="f">Review time (days)<input id="ty_rev" type="number" data-t="reviewDays" value="${esc(t.reviewDays)}"${dis?' disabled':''}></label>
   <label class="f">Validity period<input id="ty_val" type="text" data-t="validity" value="${esc(t.validity)}"${dis?' disabled':''}></label><label class="f">Renewal interval<input id="ty_ri" type="text" data-t="renewalInterval" value="${esc(t.renewalInterval)}"${dis?' disabled':''}></label>
   <label class="f wide">Notes for whoever fills this type<textarea id="ty_notes" data-t="notes"${dis?' disabled':''}>${esc(t.notes)}</textarea></label></div></section>
  ${dis?'':`<div class="savebar card"><div class="row"><label class="chk"><input type="checkbox" id="ty_reviewed"${t.review==='reviewed'?' checked':''}> Mark this type as reviewed</label><label class="chk"><input type="checkbox" id="ty_active"${t.active!==false?' checked':''}> Active (offered in the slate)</label></div><div class="row"><button type="button" class="btn" data-act="typeBack">Cancel</button><button class="btn pri" type="submit">Save type</button></div></div>`}
  </form>
  ${isNew?'':`<section class="sec" style="margin-top:14px"><header><h3>Inspection types</h3><small style="color:var(--muted)">The list this type's permits pick from, e.g. Rough, Fixtures, Finish. Actual inspection rows are added on each permit.</small></header><div class="bd stack">${(t.inspectionTypes||[]).length?`<table><thead><tr><th>#</th><th>Inspection</th><th>Performed by</th><th>Witnessed</th><th></th></tr></thead><tbody>${t.inspectionTypes.map((x,i)=>`<tr><td>${esc(x.seq)}</td><td>${esc(x.name)}</td><td>${esc(x.by||'—')}</td><td>${x.witnessed?'Yes':'No'}</td><td>${dis?'':`<button class="btn link" data-act="itDel" data-i="${i}">Remove</button>`}</td></tr>`).join('')}</tbody></table>`:'<small style="color:var(--muted)">No inspection types yet.</small>'}
   ${dis?'':`<div class="fields"><label class="f">Inspection name<input id="itName" type="text"></label><label class="f">Sequence<input id="itSeq" type="number"></label><label class="f">Performed by<select id="itBy">${opts(lists('Inspection Performed By'),'')}</select></label><label class="chk" style="align-self:end"><input type="checkbox" id="itW"> Witnessed</label><div style="align-self:end"><button class="btn" data-act="itAdd">Add</button></div></div>`}</div></section>`}`;
}

const REPORTS=[['status','Status distribution','Records by current status, portfolio-wide or for one job.',[['status','Current status'],['statusProject','Status by project']]],['agency','Rollup by agency','Counts and open items per agency, across every project.',[['agency','Agency'],['project','Project']]],['bic','Ball-in-court load','Who is holding up the most items: the chase list.',[['category','Category'],['company','Company'],['person','Person']]],['aging','Aging / overdue','How long items have sat, and what is past its target date.',[['overdue','Overdue only'],['all','Every open item, oldest first']]],['upcoming','Upcoming deadlines','Everything due, expiring or renewing in a chosen window.',[]],['quality','Data quality','Open data-check flags, by project or by check.',[['project','Project'],['check','Check']]],['payment','Payment status','Outstanding fees across the portfolio.',[['outstanding','Outstanding items'],['status','By payment status']]]];
function reportData(){
  const P=S.rp; const R=REPORTS.find(r=>r[0]===S.report); const grp=P.group||(R[3][0]?.[0]);
  const {map}=computed();
  const base=recs().filter(r=>(!P.project||r.projectId===P.project)&&(!P.agency||r.agency===P.agency)&&(!P.status||r.currentStatus===P.status)&&(P.show==='All'||(P.show==='Archived'?r.recordStatus==='Archived':r.recordStatus==='Active')));
  const count=(fn)=>{const o={};base.forEach(r=>{const k=fn(r);if(k!=null&&k!=='')o[k]=(o[k]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
  const recRow=r=>[r.code,r.name,projName(r.projectId),r.agency,r.currentStatus];
  switch(S.report){
    case 'status': if(grp==='statusProject'){ const o={}; base.forEach(r=>{const k=projName(r.projectId)+' · '+r.currentStatus;o[k]=(o[k]||0)+1;}); return {h:['Project · status','Records'],rows:Object.entries(o).sort()}; } return {h:['Current status','Records'],rows:count(r=>r.currentStatus)};
    case 'agency': { const key=grp==='project'?(r=>projName(r.projectId)):(r=>r.agency); const o={}; base.forEach(r=>{const k=key(r);o[k]=o[k]||[0,0,0];o[k][0]++;if(map[r.id].dl.some(d=>d[0]==='overdue'))o[k][1]++;o[k][2]+=map[r.id].checks.length;}); return {h:[grp==='project'?'Project':'Agency','Records','Overdue','Open flags'],rows:Object.entries(o).sort((a,b)=>b[1][0]-a[1][0]).map(([k,v])=>[k,...v])}; }
    case 'bic': { const fn=grp==='company'?(r=>coName(r.bicCompany)):grp==='person'?(r=>ctName(r.bicPerson)):(r=>r.bicCategory); const rows=count(fn); return {h:[grp==='company'?'Company':grp==='person'?'Person':'Category','Records'],rows,empty:'Nothing is assigned to a ball-in-court '+(grp||'category')+'.'}; }
    case 'aging': { let rs=base.filter(r=>!CLOSED.includes(r.currentStatus)); if(grp!=='all') rs=rs.filter(r=>map[r.id].dl.some(d=>d[0]==='overdue')); rs.sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')); return {h:['Code','Name','Project','Agency','Status','Days open','Days overdue'],rows:rs.map(r=>[...recRow(r),Math.floor((Date.now()-Date.parse(r.createdAt||r.updatedAt||Date.now()))/864e5),r.dTarget&&daysUntil(r.dTarget)<0?-daysUntil(r.dTarget):'']),empty:'Nothing is overdue in this scope.',rec:rs}; }
    case 'upcoming': { const from=P.from||today(); const to=P.to||new Date(Date.now()+60*864e5).toISOString().slice(0,10); const out=[]; base.forEach(r=>{ if(r.dTarget&&!r.dActual) out.push([r,'Due',r.dTarget]); if(r.setup?.expires!==false&&r.dExpiration) out.push([r,'Expires',r.dExpiration]); if(r.setup?.renewal!==false&&r.dRenewalDue) out.push([r,'Renewal due',r.dRenewalDue]); }); const rs=out.filter(x=>x[2]>=from&&x[2]<=to).sort((a,b)=>a[2].localeCompare(b[2])); return {h:['Date','What','Code','Name','Project','Agency'],rows:rs.map(([r,w,d])=>[fmtD(d),w,r.code,r.name,projName(r.projectId),r.agency]),empty:'Nothing falls due, expires or renews in this window.',note:'A record with two deadlines in the window appears once per deadline.'}; }
    case 'quality': if(grp==='check'){ const o={}; base.forEach(r=>map[r.id].checks.forEach(c=>o[c]=(o[c]||0)+1)); return {h:['Check','Records flagged'],rows:CHECKS.filter(c=>o[c[0]]).map(c=>[c[1],o[c[0]]]),empty:'Every check is clear in this scope.'}; } else { const rows=Object.entries(S.projects).map(([id,p])=>{const rs=base.filter(r=>r.projectId===id);const f=rs.filter(r=>map[r.id].checks.length);const cc={};rs.forEach(r=>map[r.id].checks.forEach(c=>cc[c]=(cc[c]||0)+1));const top=Object.entries(cc).sort((a,b)=>b[1]-a[1])[0];return [p.name,rs.length,f.length,rs.reduce((s,r)=>s+map[r.id].checks.length,0),top?CHECK_LABEL[top[0]]:'—'];}); return {h:['Project','Records','Flagged records','Open flags','Most common check'],rows}; }
    case 'payment': { const out=['Not Yet Paid','Invoice Received','Payment Requested']; if(grp==='status') return {h:['Payment status','Records'],rows:count(r=>r.paymentStatus)}; const rs=base.filter(r=>out.includes(r.paymentStatus)); return {h:['Code','Name','Project','Agency','Status','Payment'],rows:rs.map(r=>[...recRow(r),r.paymentStatus]),empty:'Nothing outstanding. Every fee-bearing record in scope is settled.',note:'Outstanding means Not Yet Paid, Invoice Received or Payment Requested. Refund Pending is money owed the other way.'}; }
  }
}
function vReports(){
  const R=REPORTS.find(r=>r[0]===S.report); const P=S.rp; const d=reportData();
  return `<div class="row" style="justify-content:space-between"><div><h1>Reports</h1><p class="lede">The whole portfolio, cut seven ways, computed live from the records. Export takes exactly what is on screen.</p></div><button class="btn" data-act="exportReport">Export to CSV (Excel)</button></div>

  ${S.report==='upcoming'?`<label class="f" style="width:150px">From<input id="rpF" type="date" data-rp="from" value="${esc(P.from||today())}"></label><label class="f" style="width:150px">To<input id="rpT" type="date" data-rp="to" value="${esc(P.to||new Date(Date.now()+60*864e5).toISOString().slice(0,10))}"></label>`:`<label class="f" style="width:200px">Group by<select id="rpG" data-rp="group">${opts(R[3],P.group||R[3][0]?.[0],null)}</select></label>`}
  <label class="f" style="width:120px">Show<select id="rpSh" data-rp="show">${opts(['Active','Archived','All'],P.show,null)}</select></label></div>
  <section class="sec"><header><h3>${R[1]}</h3><span class="pill">${d.rows.length} rows</span></header><div class="bd"><p style="color:var(--muted);margin-top:0">${R[2]}</p>
  ${d.rows.length?`<div class="tbl-wrap"><table><thead><tr>${d.h.map((h,i)=>`<th${i&&typeof d.rows[0][i]==='number'?' class="num"':''}>${h}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(c=>`<td${typeof c==='number'?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<p class="empty">${d.empty||'No records match these settings.'}</p>`}
  ${d.note?`<p style="color:var(--muted);font-size:12.5px">${d.note}</p>`:''}</div></section>`;
}

function vHelp(){
  return `<div class="help"><h1>How to use Permit Desk</h1><p class="lede">One place for every NYC permit, filing, approval, inspection and sign-off across your jobs.</p>
  <h2>The idea</h2><ol><li><b>Master catalog</b>: each kind of permit is described once: its agency, its fields, its lifecycle.</li><li><b>Project</b>: create the job and its team of default consultants.</li><li><b>Slate</b>: on the project page, tick every permit type the job needs. Each becomes a record that is Queued and Not Started.</li><li><b>Work it</b>: start an item, fill in dates, numbers and who has the ball, until it is signed off.</li><li><b>Rollups</b>: the Dashboard, Reports and the alert bell add everything up live.</li></ol>
  <h2>Records</h2><p>The Records screen is for finding and scanning. Filters with two values mean "either one"; two different filters mean "both". Pick columns with the Columns menu. Click a row for a summary, then <b>Open full</b> to edit. Only the fields the permit type uses are shown.</p>
  <p>The four "who" fields answer different questions: <b>Ball-in-court</b> is whose turn it is now, <b>Responsible</b> owns it overall, <b>Action owner</b> does the next step, and <b>Agency reviewer</b> is the examiner. People are never filled in for you; use <b>Load all defaults</b> or drop in a team member.</p>
  <h2>Deadlines and data checks</h2><p>Only Active records count. Due within 7 days and Overdue read Target completion; Expiring reads Expiration (60 days); Renewal reads Renewal due (30 days); Stale means nobody touched it in 30 days. Eleven data checks flag records that look wrong, such as Issued with no issue date or nobody ball-in-court.</p>
  <h2>TRs</h2><p>Special inspections are their own agency in the catalog. When every TR on a project has a Final received, the project's "All TRs signed off" line turns satisfied on its own.</p>
  <h2>Rules</h2><ul><li>Companies, contacts and list values are set inactive or retired, never deleted.</li><li>Names and addresses tidy to proper case when you leave the field. Exceptions (HQ, LLC, DOB…) live in Settings.</li><li>All dates are New York time.</li><li>Every change to a record is kept in its History tab.</li></ul>
  <h2>Sharing</h2><p>Use Claude's Share button on this page. Contributors can do all the daily work; owners and editors can also change Settings.</p></div>`;
}

function renderBell(){

  p.innerHTML=`<h4>Alerts · ${n}</h4>`+(a===null?`<p class="it" style="cursor:default">Your login isn't linked to a contact yet, so nothing is routed to you. <button class="btn link" data-act="goPeople">Link it in Settings</button></p>`:n?a.map(({r,d})=>`<div class="it" data-open="${r.id}"><span class="code">${esc(r.code)}</span> ${esc(r.name)}<br><small style="color:var(--muted)">${esc(DEADLINES.find(x=>x[0]===d[0])[1])} · ${fmtD(d[1])}</small></div>`).join(''):`<p class="it" style="cursor:default">Nothing needs you right now.</p>`)+`<p class="it" style="cursor:default"><button class="btn link" data-act="goComms">Choose alert types</button></p>`;
