# Pings the Permit Desk database once a day so the free Supabase project never pauses for inactivity.
name: Keep Permit Desk awake
on:
  schedule:
    - cron: "17 13 * * *"   # every day, 8:17am New York (winter time)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -fsS -X POST "https://kxscczhqvkmrwmhnpjuj.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_rhR5n-nq6xNw1JVLP1SBxQ_MuexWAPJ" \
            -H "content-type: application/json" -d '{}'
